<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Еще — EPALLAXIS</title>

<link rel="icon" type="image/png" href="../../icon.png">

<style>

:root {
  --bg: #060a10;
  --panel: #101820;
  --panel2: #141f2b;
  --text: #e8f0ea;
  --muted: #9aa4b2;

  --accent: #22ff88;
  --border: rgba(34,255,136,.18);

  --radius: 18px;
}


/* =========================
   RESET
========================= */

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


body {

  min-height:100vh;

  background:
    radial-gradient(
      1000px 600px at 20% 0%,
      #10251c 0%,
      #060a10 60%
    );

  color:var(--text);

  padding:0 20px 50px;

}



/* =========================
   HEADER
========================= */

header {

  position:sticky;

  top:0;

  z-index:100;

  margin:0 -20px;

  padding:18px 20px;

  background:
    rgba(6,10,16,.82);

  backdrop-filter:blur(14px);

  border-bottom:
    1px solid var(--border);

}



.header-row {

  display:flex;

  justify-content:space-between;

  align-items:center;

}


.logo {

  font-size:28px;

  font-weight:800;

  letter-spacing:2px;

}


.logo span {

  color:var(--accent);

}


.subtitle {

  margin-top:4px;

  color:var(--muted);

  font-size:14px;

}



/* =========================
   BUTTON UPDATE
========================= */


.reload-btn {

  margin-top:20px;

  background:transparent;

  border:

    1px solid var(--border);

  color:var(--muted);

  padding:

    9px 22px;

  border-radius:30px;

  cursor:pointer;

  font-size:14px;

  transition:.3s;

}


.reload-btn:hover {

  color:var(--accent);

  border-color:var(--accent);

  box-shadow:

    0 0 20px

    rgba(34,255,136,.15);

}


.reload-btn.loading {

  opacity:.5;

  pointer-events:none;

}



/* =========================
   TITLE
========================= */


.page-title {

  width:100%;

  max-width:1200px;

  margin:

    35px auto 20px;

}


.page-title h1 {

  font-size:

    clamp(32px,5vw,46px);

}


.page-title span {

  color:var(--accent);

}


.page-title p {

  margin-top:8px;

  color:var(--muted);

  font-size:16px;

}




/* =========================
   CARDS CONTAINER
========================= */


.cards {

  width:100%;

  max-width:1200px;

  margin:

    0 auto;

  display:flex;

  flex-direction:column;

  gap:16px;

}



/* =========================
   CARD
========================= */


.extra-card {

  width:100%;

  min-height:110px;


  display:flex;

  align-items:center;

  gap:22px;


  padding:

    22px 28px;


  border-radius:

    var(--radius);


  background:

    linear-gradient(
      145deg,
      var(--panel),
      var(--panel2)
    );


  border:

    1px solid rgba(255,255,255,.08);


  text-decoration:none;

  color:var(--text);


  position:relative;

  overflow:hidden;


  transition:

    .35s;

}



.extra-card:hover {

  transform:

    translateY(-4px);


  border-color:

    var(--card-color);


  box-shadow:

    0 15px 40px

    rgba(0,0,0,.35);

}



.extra-card::before {

  content:"";

  position:absolute;

  left:0;

  top:0;

  width:5px;

  height:100%;

  background:

    var(--card-color);

}



.card-icon {

  flex-shrink:0;

  width:60px;

  height:60px;

  display:flex;

  align-items:center;

  justify-content:center;


  border-radius:16px;


  background:

    color-mix(
      in srgb,
      var(--card-color) 15%,
      transparent
    );


  font-size:32px;

}



.card-info {

  flex:1;

  min-width:0;

}


.card-name {

  font-size:22px;

  font-weight:650;

  line-height:1.25;

}


.card-description {

  margin-top:7px;

  color:var(--muted);

  font-size:15px;

  line-height:1.45;

  word-break:break-word;

}



.card-arrow {

  font-size:28px;

  color:var(--card-color);

  opacity:.5;

}



/* =========================
   EMPTY / ERROR
========================= */


.message {

  text-align:center;

  padding:40px 20px;

  color:var(--muted);

}


.message.error {

  color:#ff7777;

}



/* =========================
   MOBILE
========================= */


@media(max-width:700px){


body {

  padding:

    0 12px 40px;

}


header {

  margin:

    0 -12px;

  padding:

    15px 12px;

}



.logo {

  font-size:22px;

}


.extra-card {

  padding:

    18px;

  gap:14px;

}


.card-icon {

  width:48px;

  height:48px;

  font-size:25px;

}


.card-name {

  font-size:18px;

}


.card-description {

  font-size:13px;

}


.card-arrow {

  display:none;

}


}


</style>

</head>


<body>


<header>

<div class="header-row">

<div>

<div class="logo">
EPALLAXIS <span>extra</span>
</div>

<div class="subtitle">
Дополнительные материалы и возможности
</div>

</div>

</div>

</header>



<div class="page-title">

<h1>
Еще <span>материалы</span>
</h1>

<p>
Полезные разделы, инструменты и дополнительные возможности
</p>


<button class="reload-btn" id="reloadBtn">
🔄 Обновить карточки
</button>


</div>



<div class="cards" id="cardsContainer">

<div class="message">
⏳ Загрузка карточек...
</div>


</div>

<script>


/* =====================================================
   GOOGLE SHEET
===================================================== */


const sheetURL = 
"https://docs.google.com/spreadsheets/d/e/2PACX-1vT-ffMQhoWFYjEYo_1zj42dMreh4l1HQKXEV9J_ZnI4NLkMvYVyL7KWmmdwRCX3qoHjSq8czHR-bvWX/pub?output=csv";



const cardsContainer =
document.getElementById("cardsContainer");


const reloadBtn =
document.getElementById("reloadBtn");



/* =====================================================
   RANDOM ICONS
===================================================== */


const icons = [

"📘",
"🧠",
"⚙️",
"🚀",
"🎯",
"💡",
"🧩",
"🛠️",
"📚",
"🔬",
"🌐",
"✨",
"🎨",
"📊",
"🔥"

];



function randomIcon(){

return icons[
Math.floor(
Math.random()*icons.length
)
];

}




/* =====================================================
   PREMIUM COLORS
===================================================== */


const colors = [

"#7C9A92",
"#8A7C9A",
"#9A8B7C",
"#6F8FAF",
"#8FAF8F",
"#AF8F8F",
"#7F8FAF",
"#9F9A70",
"#718A86",
"#8B829A"

];



function randomColor(){

return colors[
Math.floor(
Math.random()*colors.length
)
];

}





/* =====================================================
   CSV PARSER
===================================================== */


function parseCSV(text){


const rows=[];

let row=[];
let value="";
let insideQuotes=false;



for(let i=0;i<text.length;i++){


const char=text[i];



if(char === '"'){

insideQuotes=!insideQuotes;

continue;

}



if(char==="," && !insideQuotes){

row.push(value.trim());

value="";

}

else if(char==="\n" && !insideQuotes){

row.push(value.trim());

rows.push(row);

row=[];

value="";

}

else{

value+=char;

}

}



if(value || row.length){

row.push(value.trim());

rows.push(row);

}



return rows;


}





/* =====================================================
   LOAD DATA
===================================================== */


async function loadCards(){


reloadBtn.classList.add("loading");

reloadBtn.textContent=
"⏳ Обновление...";


cardsContainer.innerHTML=
`
<div class="message">
⏳ Загрузка карточек...
</div>
`;



try{


const response =
await fetch(
sheetURL + "&t=" + Date.now()
);



if(!response.ok){

throw new Error(
"Ошибка загрузки таблицы"
);

}



const csv =
await response.text();



const rows =
parseCSV(csv);



if(rows.length < 2){

throw new Error(
"Таблица пустая"
);

}



const headers =
rows[0]
.map(
h=>h.toLowerCase().trim()
);



const orderIndex =
headers.indexOf(
"порядок"
);


const nameIndex =
headers.indexOf(
"название"
);


const descIndex =
headers.indexOf(
"описание"
);


const linkIndex =
headers.indexOf(
"ссылка"
);


const activeIndex =
headers.indexOf(
"активность"
);




if(
orderIndex===-1 ||
nameIndex===-1 ||
descIndex===-1 ||
linkIndex===-1 ||
activeIndex===-1
){

throw new Error(
"Не найдены нужные столбцы"
);

}





const cards=[];



for(let i=1;i<rows.length;i++){


const row=rows[i];


if(!row.length)
continue;



const active =
String(row[activeIndex])
.toLowerCase()
.trim();



if(active!=="true")
continue;




cards.push({

order:
Number(row[orderIndex])
||9999,


name:
row[nameIndex]
||"Без названия",


description:
row[descIndex]
||"",


link:
row[linkIndex]
||""

});


}




cards.sort(
(a,b)=>
a.order-b.order
);



renderCards(cards);



}

catch(error){


console.error(error);


cardsContainer.innerHTML=
`
<div class="message error">
⚠️ ${error.message}
</div>
`;

}


finally{


reloadBtn.classList.remove("loading");

reloadBtn.textContent=
"🔄 Обновить карточки";


}



}





/* =====================================================
   CREATE CARDS
===================================================== */


function renderCards(cards){


cardsContainer.innerHTML="";



if(cards.length===0){

cardsContainer.innerHTML=
`
<div class="message">
Нет доступных материалов
</div>
`;

return;

}



cards.forEach(cardData=>{


const card =
document.createElement("a");



const color =
randomColor();



card.className=
"extra-card";


card.href =
cardData.link;


card.target =
"_blank";



card.style
.setProperty(
"--card-color",
color
);




card.innerHTML=
`

<div class="card-icon">
${randomIcon()}
</div>


<div class="card-info">


<div class="card-name">
${escapeHTML(cardData.name)}
</div>


<div class="card-description">
${escapeHTML(cardData.description)}
</div>


</div>


<div class="card-arrow">
→
</div>


`;



cardsContainer.appendChild(card);



});


}





/* =====================================================
   PROTECTION FROM HTML IN TABLE
===================================================== */


function escapeHTML(text){


return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);


}






/* =====================================================
   UPDATE BUTTON
===================================================== */


reloadBtn.addEventListener(
"click",
loadCards
);



/* FIRST LOAD */


loadCards();



</script>
