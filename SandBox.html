<script>


/* ================================================================
   GOOGLE SHEETS — ГЛАВЫ
================================================================ */


/*
Таблица глав:

Порядок
Глава
Заголовок
Текст
Таблица
Активность


Активность:
TRUE  → показываем
FALSE → скрываем


Столбец "Таблица" содержит ссылку
на таблицу заданий конкретной главы.
*/





const chaptersSheetURL =

"https://docs.google.com/spreadsheets/d/e/2PACX-1vQvHTb3SOfhmvWJAmeFnHtiCj9JSMel_M1yHofabPwinYq4fSoCpy3GrP3r73ks3krE0p-snzXlK3cJ/pubhtml?gid=0&single=true";






/* ================================================================
   ELEMENTS
================================================================ */



const roadmapItems =

document.getElementById(

"roadmapItems"

);





const lineFill =

document.getElementById(

"lineFill"

);





const progressFill =

document.getElementById(

"progressFill"

);





const materialsSection =

document.getElementById(

"materialsSection"

);





const materialsGrid =

document.getElementById(

"materialsGrid"

);





const chapterName =

document.getElementById(

"chapterName"

);





const reloadBtn =

document.getElementById(

"reloadBtn"

);







/* ================================================================
   DATA
================================================================ */



let chapters = [];





let activeChapterIndex = -1;





let currentChapter = null;









/* ================================================================
   CSV PARSER
================================================================ */



function parseCSV(text){



const rows = [];



let row = [];



let value = "";



let quotes = false;







for(
let i = 0;
i < text.length;
i++
){



const char = text[i];







if(char === '"'){



if(
quotes &&
text[i + 1] === '"'
){



value += '"';



i++;



}

else{



quotes = !quotes;



}



}






else if(
char === "," &&
!quotes
){



row.push(value);



value = "";



}






else if(
(
char === "\n" ||
char === "\r"
)
&&
!quotes
){



if(
value !== "" ||
row.length > 0
){



row.push(value);



rows.push(row);



}



row = [];



value = "";



}






else{



value += char;



}



}






if(
value !== "" ||
row.length > 0
){



row.push(value);



rows.push(row);



}






return rows;



}







/* ================================================================
   HTML SAFE
================================================================ */



function escapeHTML(text){



return String(text)



.replace(
/&/g,
"&amp;"
)



.replace(
/</g,
"&lt;"
)



.replace(
/>/g,
"&gt;"
)



.replace(
/"/g,
"&quot;"
)



.replace(
/'/g,
"&#039;"
);



}

/* ================================================================
   ЗАГРУЗКА ГЛАВ
================================================================ */
function convertToCSV(url){

return url
.replace(
"/pubhtml",
"/pub"
)
.replace(
"&single=true",
""
)
.includes("output=csv")

?
url

:

url
.replace(
"/pubhtml",
"/pub"
)
.replace(
"?gid=",
"?output=csv&gid="
)
.replace(
"&single=true",
"");

}


async function loadChapters(){



try{



const csvURL = convertToCSV(chaptersSheetURL);








const response =

await fetch(

csvURL +

"&t=" +

Date.now()

);








if(
!response.ok
){



throw new Error(
"Не удалось загрузить таблицу глав"
);



}








const csv =

await response.text();








const rows =

parseCSV(csv);








if(
rows.length < 2
){



throw new Error(
"Таблица глав пустая"
);



}








const headers =

rows[0].map(

item =>

item
.trim()
.toLowerCase()

);








const orderIndex =

headers.indexOf(
"порядок"
);





const chapterIndex =

headers.indexOf(
"глава"
);





const titleIndex =

headers.indexOf(
"заголовок"
);





const textIndex =

headers.indexOf(
"текст"
);





const tableIndex =

headers.indexOf(
"таблица"
);





const activityIndex =

headers.indexOf(
"активность"
);








if(
chapterIndex === -1 ||
titleIndex === -1 ||
tableIndex === -1 ||
activityIndex === -1
){



throw new Error(
"В таблице глав отсутствуют обязательные столбцы"
);



}








chapters = [];








rows
.slice(1)
.forEach(

row => {






const active =

String(
row[activityIndex]
)

.trim()

.toLowerCase();








if(
active !== "true"
){



return;



}








chapters.push({



order:

Number(
row[orderIndex]
)

|| 999,





chapter:

row[chapterIndex]

||

"",





title:

row[titleIndex]

||

"",





text:

row[textIndex]

||

"",





table:

row[tableIndex]

||

""



});







}

);









chapters.sort(

(a,b)=>

a.order - b.order

);








buildRoadmap();






}

catch(error){



console.error(
error
);







roadmapItems.innerHTML =



`

<div class="msg error">

❌ ${escapeHTML(error.message)}

</div>

`;





}



}

/* ================================================================
   ПОСТРОЕНИЕ КАРТОЧЕК ГЛАВ
================================================================ */



function buildRoadmap(){



roadmapItems.innerHTML = "";







chapters.forEach(

(chapter,index)=>{





const item =

document.createElement(
"div"
);







item.className =

"roadmap-item";







item.dataset.index =

index;








item.style.transitionDelay =

`${index * 0.08}s`;









const cardNumber =

chapter.chapter ||

`Глава ${index + 1}`;








item.innerHTML =



`

<div class="roadmap-marker"></div>





<div

class="roadmap-card"

data-index="${index}">

/* ================================================================
   АНИМАЦИЯ ПОЯВЛЕНИЯ
================================================================ */



function observeRoadmap(){



const items =

document.querySelectorAll(

".roadmap-item"

);








const observer =

new IntersectionObserver(

entries=>{



entries.forEach(

entry=>{



if(
entry.isIntersecting
){



entry.target.classList.add(
"visible"
);



}



}

);



},

{

threshold:

0.15

}

);








items.forEach(

item =>

observer.observe(item)

);



}

/* ================================================================
   ОТКРЫТИЕ ГЛАВЫ
================================================================ */



function openChapter(

chapter,

index

){



currentChapter = chapter;



activeChapterIndex = index;







document
.querySelectorAll(
".roadmap-item"
)

.forEach(

item=>{

item.classList.remove(
"active"
);

}

);







const currentItem =

document.querySelector(

`.roadmap-item[data-index="${index}"]`

);







if(currentItem){



currentItem.classList.add(
"active"
);



}







chapterName.textContent =

chapter.title ||

chapter.chapter ||

"глава";







materialsSection.style.display =

"block";







materialsGrid.innerHTML =



`

<div class="msg">

⏳ Загрузка заданий...

</div>

`;







loadMaterials(

chapter.table

);







updateProgress();



}









/* ================================================================
   ЗАГРУЗКА ЗАДАНИЙ
================================================================ */



async function loadMaterials(

tableURL

){



try{



if(
!tableURL ||
tableURL.trim()===""
){



throw new Error(
"Для этой главы не указана таблица заданий"
);



}












const csvURL = convertToCSV(tableURL);








const response =

await fetch(

csvURL +

"&t=" +

Date.now()

);








if(
!response.ok
){



throw new Error(
"Не удалось загрузить таблицу заданий"
);



}








const csv =

await response.text();








const rows =

parseCSV(csv);








if(
rows.length < 2
){



throw new Error(
"Таблица заданий пустая"
);



}








buildMaterials(

rows

);






}

catch(error){



console.error(
error
);






materialsGrid.innerHTML =



`

<div class="msg error">

❌ ${escapeHTML(error.message)}

</div>

`;





}



}

/* ================================================================
   СОЗДАНИЕ КАРТОЧЕК ЗАДАНИЙ
================================================================ */



function buildMaterials(rows){



const headers =

rows[0].map(

item =>

item
.trim()
.toLowerCase()

);







const orderIndex =

headers.indexOf(
"порядок"
);







const nameIndex =

headers.indexOf(
"название"
);







const linkIndex =

headers.indexOf(
"ссылка"
);







const activityIndex =

headers.indexOf(
"активность"
);







if(
nameIndex === -1 ||
linkIndex === -1 ||
activityIndex === -1
){



throw new Error(
"В таблице заданий отсутствуют обязательные столбцы"
);



}







const tasks = [];







rows
.slice(1)
.forEach(

row=>{



const active =

String(
row[activityIndex]
)

.trim()

.toLowerCase();








if(
active !== "true"
){



return;



}








tasks.push({



order:

Number(
row[orderIndex]
)

||

999,





name:

row[nameIndex]

||

"",





link:

row[linkIndex]

||

""



});






}

);









tasks.sort(

(a,b)=>

a.order-b.order

);







renderMaterials(

tasks

);





}









/* ================================================================
   ОТОБРАЖЕНИЕ КАРТОЧЕК ЗАДАНИЙ
================================================================ */



function renderMaterials(tasks){



materialsGrid.innerHTML = "";








if(
tasks.length === 0
){



materialsGrid.innerHTML =



`

<div class="msg">

Нет активных заданий

</div>

`;



return;



}








tasks.forEach(

(task,index)=>{



const card =

document.createElement(
"a"
);








card.className =

"material-card";








card.href =

task.link;








card.target =

"_blank";








card.rel =

"noopener noreferrer";








card.style.animationDelay =

`${index * 0.06}s`;








card.innerHTML =



`

<div class="material-icon">

📝

</div>





<div class="material-info">



<div class="material-name">

${escapeHTML(task.name)}

</div>





<div class="material-badge">

Задание ${index + 1}

</div>



</div>





<div class="material-arrow">

→

</div>

`;








materialsGrid.appendChild(

card

);



}

);



}

/* ================================================================
   ОБНОВЛЕНИЕ ПРОГРЕССА
================================================================ */



function updateProgress(){



if(
chapters.length === 0
){



return;



}








const percent =



(
(activeChapterIndex + 1)

/

chapters.length

)

*

100;







if(progressFill){



progressFill.style.width =

percent + "%";

}



if(lineFill){



lineFill.style.height =

percent + "%";

}



}
