<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Объявления — EPALLAXIS extra</title>
<link rel="icon" type="image/png" href="../../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* --- СЕЗОННЫЕ ПЕРЕМЕННЫЕ --- */
:root {
    --bg: #0A0705; 
    --surface: linear-gradient(145deg, #1C1510 0%, #110B07 100%);
    --surface-hover: linear-gradient(145deg, #291E17 0%, #140E0A 100%);
    --text: #FFFFFF;
    --text-muted: #C0B8B0; 
    --accent: #FF8A00; 
    --accent-glow: rgba(255, 138, 0, 0.3);
    --border: rgba(255, 255, 255, 0.08);
    
    --font-sans: 'Inter', sans-serif;
    --font-display: 'Manrope', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

body.season-winter {
    --bg: #080C14;
    --surface: linear-gradient(145deg, #101724 0%, #070B12 100%);
    --surface-hover: linear-gradient(145deg, #131C2E 0%, #0A101D 100%);
    --text-muted: #9CA3AF;
    --accent: #3B82F6; 
    --accent-glow: rgba(59, 130, 246, 0.3);
}

body.season-spring {
    --bg: #0C0A0B; 
    --surface: linear-gradient(145deg, #1C1316 0%, #0F0A0C 100%);
    --surface-hover: linear-gradient(145deg, #241A1D 0%, #140E10 100%);
    --text-muted: #D1C4C7; 
    --accent: #FFB7C5; 
    --accent-glow: rgba(255, 183, 197, 0.3);
}

body.season-summer {
    --bg: #060A08;
    --surface: linear-gradient(145deg, #0D1812 0%, #060B08 100%);
    --surface-hover: linear-gradient(145deg, #13221A 0%, #0B140F 100%);
    --text-muted: #9CA3AF;
    --accent: #10B981; 
    --accent-glow: rgba(16, 185, 129, 0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; max-width: 100vw; overflow-x: clip; }

body {
    font-family: var(--font-sans);
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.3s ease;
    padding-bottom: 60px;
}

/* Фоновые свечения */
body::before, body::after {
    content: '';
    position: fixed;
    width: 100vmax;
    height: 100vmax;
    border-radius: 50%;
    filter: blur(150px);
    z-index: -1;
    opacity: 0.15;
    pointer-events: none;
    transition: background 0.3s ease;
}
body::before { top: -50vmax; left: -50vmax; background: var(--accent); }
body::after { bottom: -50vmax; right: -50vmax; background: var(--text); opacity: 0.03; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* --- ШАПКА --- */
header {
    position: sticky; top: 0; left: 0; right: 0; width: 100%; z-index: 200;
    background: rgba(10, 7, 5, 0.6);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px; display: flex; align-items: center; gap: 16px; flex-shrink: 0;
    transition: border-color 0.3s ease;
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand a { text-decoration: none; color: var(--text); display: inline-block; transition: transform 0.2s; }
.brand a:hover { transform: translateY(-1px); }
.brand h1 { 
    font-family: var(--font-display); font-size: clamp(20px, 4vw, 24px); 
    letter-spacing: 0.05em; line-height: 1.1; font-weight: 800; text-transform: uppercase; 
}
.brand h1 .accent-word { 
    color: var(--accent); font-weight: 500; 
    text-shadow: 0 0 20px var(--accent-glow); 
    transition: color 0.3s ease, text-shadow 0.3s ease;
}
.brand p { font-family: var(--font-mono); font-size: clamp(10px, 1.5vw, 12px); color: var(--text-muted); margin-top: 4px; text-transform: uppercase; }

/* --- ЗАГОЛОВОК СТРАНИЦЫ --- */
.page-title {
    max-width: 1400px;
    margin: 50px auto 32px;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
}

.title-text h1 {
    font-family: var(--font-display);
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    text-transform: uppercase;
}

/* Стили для "Дополнительно" (акцентный) и "Объявления" (белый) */
.title-text h1 .accent-text {
    color: var(--accent);
    transition: color 0.3s ease;
    text-shadow: 0 0 30px var(--accent-glow);
}

.title-text h1 .white-text {
    color: #FFFFFF;
}

.title-text p {
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 15px;
    max-width: 500px;
}

/* Кнопка обновления */
.reload-btn {
    padding: 12px 24px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: rgba(0, 0, 0, 0.2);
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
}

.reload-btn:hover:not(:disabled) {
    background: var(--accent-glow);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.reload-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    border-color: var(--border);
    color: var(--text-muted);
}

/* --- СЕТКА КАРТОЧЕК (GRID) --- */
.cards {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
}

/* --- ПРЕМИАЛЬНАЯ КАРТОЧКА --- */
.extra-card {
    display: flex;
    flex-direction: column;
    padding: 24px;
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    position: relative;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
    
    --card-color: var(--accent);
    --card-glow: var(--accent-glow);
}

/* Красивое неоновое свечение при наведении */
.extra-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(800px circle at top left, var(--card-glow), transparent 40%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    z-index: 0;
}

.extra-card:hover {
    background: var(--surface-hover);
    border-color: var(--card-color);
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), 0 0 25px var(--card-glow);
    z-index: 2;
}

.extra-card:hover::before {
    opacity: 1;
}

.card-top {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
}

/* ИКОНКА */
.card-icon {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    transition: all 0.3s ease;
}

.extra-card:hover .card-icon {
    transform: scale(1.1) rotate(5deg);
    border-color: var(--card-color);
    background: rgba(0, 0, 0, 0.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 0 15px var(--card-glow);
}

/* СТРЕЛКА В УГЛУ */
.card-arrow {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-muted);
    font-size: 16px;
    transition: all 0.3s ease;
    opacity: 0.5;
}

.extra-card:hover .card-arrow {
    color: #000;
    background: var(--card-color);
    opacity: 1;
    transform: translateX(4px) translateY(-4px);
    box-shadow: 0 0 15px var(--card-glow);
}

/* ТЕКСТ */
.card-info {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.card-name {
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.2;
    transition: color 0.3s ease;
}

.extra-card:hover .card-name {
    color: var(--card-color);
}

.card-description {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text-muted);
    overflow-wrap: anywhere;
    flex-grow: 1;
    margin-bottom: 16px;
}

/* --- БЛОК ССЫЛОК (СЕКЦИЙ) ВНУТРИ КАРТОЧКИ --- */
.card-sections {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding-top: 16px;
}

.section-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-family: var(--font-display);
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.2s;
}

.section-btn:hover {
    background: var(--card-color);
    color: #000;
    border-color: var(--card-color);
    padding-left: 18px;
    box-shadow: 0 0 10px var(--card-glow);
}

.section-btn span {
    color: var(--card-color);
    font-family: var(--font-sans);
    transition: color 0.2s;
}

.section-btn:hover span {
    color: #000;
}

/* --- СЛУЖЕБНЫЕ СООБЩЕНИЯ --- */
.message {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 24px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: 1px dashed var(--border);
    border-radius: 16px;
    background: rgba(0,0,0,0.2);
}

.message.error {
    color: #FF5C7A;
    border-color: #FF5C7A;
    background: rgba(255, 92, 122, 0.05);
}

/* --- АНИМАЦИИ --- */
.extra-card {
    opacity: 0;
    transform: translateY(30px);
    animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes cardAppear {
    to { opacity: 1; transform: translateY(0); }
}

.loading {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
}

/* --- АДАПТАЦИЯ --- */
@media(max-width: 768px) {
    header { padding: 16px; }
    .page-title { margin: 32px auto 24px; padding: 0 16px; flex-direction: column; align-items: flex-start; }
    .cards { padding: 0 16px; grid-template-columns: 1fr; gap: 16px; }
    
    .extra-card { padding: 20px; }
    .card-icon { width: 48px; height: 48px; font-size: 24px; }
    .card-name { font-size: 1.15rem; }
    .card-description { font-size: 0.85rem; }
    .reload-btn { width: 100%; justify-content: center; }
}
</style>
</head>

<body>

<!-- ШАПКА -->
<header>
    <div class="brand">
        <a href="https://drapejnik.github.io/epallaxis/index.html">
            <h1>EPALLAXIS <span class="accent-word">extra</span></h1>
        </a>
        <p>Дополнительные материалы и возможности</p>
    </div>
</header>

<!-- ЗАГОЛОВОК -->
<section class="page-title">
    <div class="title-text">
        <h1><span class="accent-text">Дополнительно</span> <span class="white-text">Объявления</span></h1>
        <p>Актуальные объявления и новости</p>
    </div>
    <button class="reload-btn" id="reloadBtn">
        🔄 Обновить
    </button>
</section>

<!-- СЕТКА КАРТОЧЕК -->
<main class="cards" id="cardsContainer">
    <div class="message loading">
        ⏳ Загрузка карточек...
    </div>
</main>

<script>
/* =====================================================
   1. СИНХРОНИЗАЦИЯ ТЕМЫ (ИЗ ГЛАВНОЙ)
===================================================== */
function getCurrentSeason() {
    const month = new Date().getMonth();
    if (month === 11 || month <= 1) return 'winter';
    if (month >= 2 && month <= 4) return 'spring';
    if (month >= 5 && month <= 7) return 'summer';
    return 'autumn';
}

function applyThemeFromMain() {
    const savedTheme = localStorage.getItem('epallaxis_theme') || 'auto';
    let activeSeason = savedTheme === 'auto' ? getCurrentSeason() : savedTheme;
    document.body.className = 'season-' + activeSeason;
}

applyThemeFromMain();
/* ===================================================== */

/* =====================================================
   GOOGLE SHEETS & LOGIC (GID=0 ДЛЯ ОБЪЯВЛЕНИЙ)
===================================================== */
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTCrYk2HhIsUkgP3K1Be2fbVpZqefQ79KR-9hUUF_uZNNrAfhSHaZgwtb2z3DbZZ2ZtPjAEYojKoSnX/pub?gid=0&single=true&output=csv";

const icons = ["🚀", "📚", "🧠", "🎯", "🛠️", "💡", "📌", "⭐", "🔥", "🎓", "⚡", "🌌"];

const colors = [
    "#FF8A00", // Оранжевый
    "#3B82F6", // Синий
    "#FFB7C5", // Розовый
    "#10B981", // Зеленый
    "#8B5CF6", // Фиолетовый
    "#FCD34D", // Золотой
    "#F43F5E", // Малиновый
    "#38BDF8"  // Голубой
];

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function parseCSV(text) {
    const rows = []; let row = []; let value = ""; let quotes = false;
    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
            if (quotes && text[i + 1] === '"') { value += '"'; i++; }
            else { quotes = !quotes; }
        }
        else if (char === ',' && !quotes) { row.push(value); value = ""; }
        else if (char === '\n' && !quotes) { row.push(value); rows.push(row); row = []; value = ""; }
        else { value += char; }
    }
    if (value || row.length) { row.push(value); rows.push(row); }
    return rows;
}

let loading = false;

async function loadCards() {
    if (loading) return;
    loading = true;
    const button = document.getElementById("reloadBtn");
    button.classList.add("loading");
    button.textContent = "⏳ Загрузка...";

    const container = document.getElementById("cardsContainer");
    container.innerHTML = `<div class="message loading">⏳ Загрузка карточек...</div>`;

    try {
        const response = await fetch(sheetURL + "&t=" + Date.now());
        if (!response.ok) throw new Error("Ошибка загрузки таблицы");

        const csv = await response.text();
        const rows = parseCSV(csv);

        if (rows.length < 2) throw new Error("Таблица пустая");

        const headers = rows[0].map(x => x.trim().toLowerCase());
        
        const orderIndex = headers.indexOf("порядок");
        const titleIndex = headers.indexOf("заголовок");
        const textIndex = headers.indexOf("текст");
        const activeIndex = headers.indexOf("активность");

        if (orderIndex === -1 || titleIndex === -1 || textIndex === -1 || activeIndex === -1) {
            throw new Error("Не найдены основные столбцы (порядок, заголовок, текст, активность)");
        }

        const sectionPairs = [];
        for (let i = 1; i <= 5; i++) {
            const nameIdx = headers.indexOf(`секция${i}`);
            const linkIdx = headers.indexOf(`ссылка${i}`);
            if (nameIdx !== -1 && linkIdx !== -1) {
                sectionPairs.push({ nameIdx, linkIdx });
            }
        }

        const cards = [];

        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row.length) continue;

            const active = row[activeIndex]?.trim().toLowerCase();
            if (active !== "true" && active !== "да" && active !== "1") continue;

            const sections = [];
            sectionPairs.forEach(pair => {
                const name = row[pair.nameIdx]?.trim();
                const link = row[pair.linkIdx]?.trim();
                if (link) {
                    sections.push({ name: name || 'Перейти', link });
                }
            });

            if (sections.length === 0) continue;

            cards.push({
                order: Number(row[orderIndex]) || 0,
                title: row[titleIndex]?.trim() || '',
                text: row[textIndex]?.trim() || '',
                sections: sections
            });
        }

        cards.sort((a, b) => a.order - b.order);
        renderCards(cards);

    } catch (error) {
        console.error(error);
        container.innerHTML = `<div class="message error">⚠️ ${error.message}</div>`;
    } finally {
        loading = false;
        button.classList.remove("loading");
        button.textContent = "🔄 Обновить";
    }
}

function renderCards(items) {
    const container = document.getElementById("cardsContainer");

    if (!items.length) {
        container.innerHTML = `<div class="message">📭 Активных карточек пока нет</div>`;
        return;
    }

    container.innerHTML = "";

    items.forEach((item, index) => {
        const isSingleLink = item.sections.length === 1;
        const card = document.createElement(isSingleLink ? "a" : "div");
        
        card.className = "extra-card";
        if (isSingleLink) {
            card.href = item.sections[0].link;
            card.target = "_blank";
        }

        const color = randomItem(colors);
        const icon = randomItem(icons);
        const glow = hexToRgba(color, 0.3);

        card.style.setProperty("--card-color", color);
        card.style.setProperty("--card-glow", glow);
        card.style.animationDelay = (index * 0.08) + "s";

        let sectionsHTML = "";
        if (!isSingleLink) {
            sectionsHTML = `<div class="card-sections">` + 
                item.sections.map(sec => `
                    <a href="${escapeHTML(sec.link)}" class="section-btn" target="_blank">
                        <span>${escapeHTML(sec.name)}</span>
                        <span>→</span>
                    </a>
                `).join('') + `</div>`;
        }

        card.innerHTML = `
            <div class="card-top">
                <div class="card-icon">${icon}</div>
                ${isSingleLink ? '<div class="card-arrow">↗</div>' : ''}
            </div>
            <div class="card-info">
                <div class="card-name">${escapeHTML(item.title)}</div>
                <div class="card-description">${escapeHTML(item.text)}</div>
            </div>
            ${sectionsHTML}
        `;

        container.appendChild(card);
    });
}

function escapeHTML(text) {
    if (!text) return '';
    return text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

document.getElementById("reloadBtn").addEventListener("click", loadCards);

loadCards();
</script>
</body>
</html>
