<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPALLAXIS — Математика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        /* --- СЕЗОННЫЕ ПЕРЕМЕННЫЕ --- */
        :root {
            --bg: #0A0705; 
            --surface: linear-gradient(145deg, #291E17 0%, #140E0A 100%);
            --surface-hover: linear-gradient(145deg, #382920 0%, #1C140F 100%);
            --text: #FFFFFF;
            --text-muted: #C0B8B0; 
            --accent: #FF8A00; 
            --accent-glow: rgba(255, 138, 0, 0.3);
            --accent-light: #FFD166;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 138, 0, 0.7);
            
            --font-sans: 'Inter', sans-serif;
            --font-display: 'Manrope', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body.season-winter {
            --bg: #080C14;
            --surface: linear-gradient(145deg, #131C2E 0%, #0A101D 100%);
            --surface-hover: linear-gradient(145deg, #1C283D 0%, #111827 100%);
            --text-muted: #9CA3AF;
            --accent: #3B82F6; 
            --accent-glow: rgba(59, 130, 246, 0.3);
            --accent-light: #93C5FD;
            --border-hover: rgba(59, 130, 246, 0.7);
        }

        body.season-spring {
            --bg: #0C0A0B; 
            --surface: linear-gradient(145deg, #241A1D 0%, #140E10 100%);
            --surface-hover: linear-gradient(145deg, #332529 0%, #1A1214 100%);
            --text-muted: #D1C4C7; 
            --accent: #FFB7C5; 
            --accent-glow: rgba(255, 183, 197, 0.3);
            --accent-light: #FFE4E1; 
            --border-hover: rgba(255, 183, 197, 0.7);
        }

        body.season-summer {
            --bg: #060A08;
            --surface: linear-gradient(145deg, #13221A 0%, #0B140F 100%);
            --surface-hover: linear-gradient(145deg, #1A2E23 0%, #0F1C15 100%);
            --text-muted: #9CA3AF;
            --accent: #10B981; 
            --accent-glow: rgba(16, 185, 129, 0.3);
            --accent-light: #6EE7B7;
            --border-hover: rgba(16, 185, 129, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html { background-color: var(--bg); scroll-behavior: smooth; transition: background-color 0.8s ease; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.8s ease;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
            transition: background 0.8s ease;
        }
        body::before { top: -250px; left: -250px; background: var(--accent); }
        body::after { bottom: -250px; right: -250px; background: var(--accent-light); opacity: 0.05; }

        a { color: inherit; text-decoration: none; }

        .frame {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .brand { 
            font-family: var(--font-display); 
            font-size: 1.2rem; 
            font-weight: 800; 
            letter-spacing: 0.05em; 
            text-transform: uppercase;
        }
        
        .brand span { 
            color: var(--accent); 
            font-weight: 500;
            text-shadow: 0 0 20px var(--accent-glow);
            transition: color 0.8s ease;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .theme-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px;
            gap: 2px;
        }

        .theme-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-btn:hover { color: var(--text); }

        .theme-btn.active {
            background: var(--accent);
            color: #000;
            font-weight: 500;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .header-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-align: right;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        .hero-editorial {
            position: relative;
            padding: 60px 0 40px;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            overflow: hidden; 
        }

        .season-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        #spring-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .hero-top {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 20px;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }

        .hero-title span {
            display: block;
            background: linear-gradient(90deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px var(--accent-glow);
            transition: background 0.8s ease;
        }

        .hero-side-text {
            position: relative;
            z-index: 1;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            max-width: 220px;
            text-align: right;
            line-height: 1.6;
            text-transform: uppercase;
        }

        .hero-bottom {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            align-items: center;
        }

        .greek-quote {
            font-size: 1rem;
            font-style: italic;
            color: var(--accent);
            padding-left: 16px;
            border-left: 2px solid var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.8s ease;
        }

        .hero-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
        }

        /* =========================================
           АНИМАЦИИ ЧАСТИЦ
           ========================================= */
        .particle {
            position: absolute;
            z-index: 0;
            pointer-events: none;
        }

        /* --- ОСЕНЬ: РЕАЛИСТИЧНЫЕ ЛИСТЬЯ (SVG) --- */
        .p-autumn { 
            width: 24px; height: 24px; 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            top: -30px;
            animation: fall-and-spin linear infinite;
            opacity: 0.8;
        }
        
        /* Кленовый лист (Красный) */
        .p-autumn:nth-child(3n+1) { 
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,5 L65,35 L95,35 L75,60 L85,90 L50,75 L15,90 L25,60 L5,35 L35,35 Z" fill="%23DC2626"/><path d="M50,5 L50,75 M65,35 L35,60 M35,35 L65,60" stroke="%237f1d1d" stroke-width="2" fill="none"/></svg>');
        }
        /* Дубовый лист (Оранжевый) */
        .p-autumn:nth-child(3n+2) { 
            width: 28px; height: 28px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,5 C60,20 75,20 75,35 C85,40 85,60 75,70 C85,85 60,95 50,95 C40,95 15,85 25,70 C15,60 15,40 25,35 C25,20 40,20 50,5 Z" fill="%23D97706"/><path d="M50,5 L50,95 M50,35 L70,25 M50,55 L75,45 M50,55 L25,45 M50,75 L65,65 M50,75 L35,65" stroke="%2392400e" stroke-width="2" fill="none"/></svg>');
        }
        /* Березовый лист (Желтый) */
        .p-autumn:nth-child(3n+3) { 
            width: 20px; height: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,5 C85,25 95,60 50,95 C5,60 15,25 50,5 Z" fill="%23FBBF24"/><path d="M50,10 L50,90 M50,30 L75,45 M50,30 L25,45 M50,55 L70,70 M50,55 L30,70" stroke="%23D97706" stroke-width="2" fill="none"/></svg>');
        }

        @keyframes fall-and-spin {
            0% { transform: translateY(-10px) translateX(0) rotate(0deg) rotateX(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            50% { transform: translateY(200px) translateX(40px) rotate(180deg) rotateX(60deg); }
            90% { opacity: 0.9; }
            100% { transform: translateY(450px) translateX(-20px) rotate(360deg) rotateX(0deg); opacity: 0; }
        }

        /* --- ЗИМА: СНЕЖИНКИ --- */
        .p-winter { 
            width: 4px; height: 4px; 
            border-radius: 50%; 
            background-color: #FFF; 
            box-shadow: 0 0 6px #FFF; 
            top: -20px;
            animation: fall linear infinite;
        }
        .p-winter:nth-child(even) { width: 6px; height: 6px; opacity: 0.6; }

        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); opacity: 0.8; }
            100% { transform: translateY(400px) translateX(30px); opacity: 0; }
        }

        /* --- ЛЕТО: СВЕТЛЯЧКИ --- */
        .p-summer {
            width: 4px; height: 4px;
            border-radius: 50%;
            background: #FDE047;
            box-shadow: 0 0 12px 2px #EAB308, 0 0 20px 4px rgba(234, 179, 8, 0.4);
            animation: float-firefly linear infinite;
        }
        
        .p-summer:nth-child(even) { width: 3px; height: 3px; }
        .p-summer:nth-child(3n) { width: 5px; height: 5px; background: #FEF08A; }

        @keyframes float-firefly {
            0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            50% { transform: translate(30px, -40px) scale(1.2); opacity: 0.6; }
            80% { opacity: 0.8; }
            100% { transform: translate(-20px, -100px) scale(0.8); opacity: 0; }
        }

        /* --- КАРТОЧКИ --- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px; 
            margin: 48px 0 80px;
        }

        .card {
            background: var(--surface);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            min-height: 190px;
            position: relative;
            text-align: left;
            font-family: inherit;
            color: inherit;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card.is-clickable { cursor: pointer; }

        .card.is-clickable:hover {
            background: var(--surface-hover);
            border-color: var(--border-hover);
            border-top-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9), 0 0 30px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .card-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-math-icon {
            font-family: 'Times New Roman', Times, serif;
            font-size: 2.2rem;
            font-weight: normal;
            color: var(--text-muted);
            opacity: 0.35;
            transition: all 0.4s ease;
            line-height: 1;
        }

        .card.is-clickable:hover .card-math-icon {
            color: var(--accent);
            opacity: 1;
            transform: scale(1.1) rotate(-5deg);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.2;
            color: #FFFFFF;
            letter-spacing: -0.01em;
        }

        .card-text {
            font-size: 0.9rem;
            color: var(--text); 
            opacity: 0.8;
            line-height: 1.5;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .card-tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--accent-light);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .card.is-clickable:hover .card-tag {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Модалка */
        dialog {
            margin: auto;
            background: var(--bg);
            backdrop-filter: blur(20px);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 32px 80px rgba(0,0,0,0.9), 0 0 0 1px var(--accent-glow) inset;
        }

        dialog[open] { animation: modal-in 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modal-in { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        dialog::backdrop { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); }

        .dialog-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(180deg, var(--accent-glow) 0%, transparent 100%);
        }

        .dialog-title { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; }
        .dialog-sub { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); text-transform: uppercase; margin-top: 6px; }
        
        .dialog-close {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text-muted);
            cursor: pointer; width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-mono); font-size: 1.1rem; transition: all 0.2s;
        }
        .dialog-close:hover { color: #000; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); transform: rotate(90deg); }

        .dialog-mosaic { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

        .section-btn {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text); font-family: var(--font-display);
            font-size: 1.1rem; font-weight: 700; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .section-btn:hover { background: var(--surface-hover); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.8), 0 0 25px var(--accent-glow); }
        
        .section-btn .arrow {
            display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; background: rgba(255, 255, 255, 0.05);
            border-radius: 50%; color: var(--accent); font-family: var(--font-sans); transition: all 0.3s;
        }

        .section-btn:hover .arrow { background: var(--accent); color: #000; transform: translateX(4px); box-shadow: 0 0 10px var(--accent-glow); }

        body.modal-open { overflow: hidden; }

        .status-message {
            grid-column: 1 / -1; text-align: center; padding: 60px 20px;
            color: var(--text-muted); font-family: var(--font-mono); text-transform: uppercase;
        }

        @media (max-width: 900px) {
            .header-right { flex-direction: column; align-items: flex-end; gap: 8px; }
            .header-meta { display: none; }
        }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 16px; padding: 20px 0; }
            .header-right { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; }
            .hero-top { flex-direction: column; gap: 16px; align-items: flex-start; }
            .hero-bottom { grid-template-columns: 1fr; gap: 20px; }
            .cards-grid { grid-template-columns: 1fr; margin-top: 24px; gap: 16px; }
            .dialog-mosaic { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="frame">
        <header>
            <div class="brand">EPALLAXIS<span>_math</span></div>
            
            <div class="header-right">
                <div class="theme-switcher" id="theme-switcher">
                    <button class="theme-btn" data-theme="auto">AUTO</button>
                    <button class="theme-btn" data-theme="autumn">ОСЕНЬ</button>
                    <button class="theme-btn" data-theme="winter">ЗИМА</button>
                    <button class="theme-btn" data-theme="spring">ВЕСНА</button>
                    <button class="theme-btn" data-theme="summer">ЛЕТО</button>
                </div>

                <div class="header-meta">
                    SYS.STATUS: ONLINE<br>
                    2024 — 2025
                </div>
            </div>
        </header>

        <section class="hero-editorial">
            <canvas id="spring-canvas"></canvas>
            <div class="season-particles" id="particles-container"></div>

            <div class="hero-top">
                <h1 class="hero-title">
                    Математика
                    <span>5–11 классы</span>
                </h1>
                <div class="hero-side-text">
                    Структурированная база знаний.<br>
                    Теория / Практика / Экзамены.
                </div>
            </div>
            
            <div class="hero-bottom">
                <div class="greek-quote">Ἐπάλλαξις — приводить систему в порядок</div>
                <div class="hero-desc">
                    Выберите свой класс из каталога ниже, чтобы перейти к учебным модулям и подготовке к экзаменам.
                </div>
            </div>
        </section>

        <main>
            <section id="cards-grid" class="cards-grid" aria-label="Список классов">
                <!-- Карточки генерируются здесь -->
            </section>
        </main>
    </div>

    <dialog id="section-dialog">
        <div class="dialog-header">
            <div>
                <div class="dialog-title" id="dialog-title">КЛАСС</div>
                <div class="dialog-sub">Выберите раздел</div>
            </div>
            <button class="dialog-close" id="dialog-close" aria-label="Закрыть">✕</button>
        </div>
        <div class="dialog-mosaic" id="dialog-sections"></div>
    </dialog>

    <script>
        (function () {
            'use strict';

            // ==========================================
            // 1. УНИКАЛЬНЫЕ СТРОЧНЫЕ ГРЕЧЕСКИЕ БУКВЫ
            // ==========================================
            const GREEK_LETTERS = [
                'α', 'β', 'γ', 'δ', 'ε', 'ζ', 'η', 'θ', 'ι', 'κ', 'λ', 'μ', 
                'ν', 'ξ', 'ο', 'π', 'ρ', 'σ', 'τ', 'υ', 'φ', 'χ', 'ψ', 'ω'
            ];
            let availableLetters = [];

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function resetSymbols() {
                availableLetters = shuffle([...GREEK_LETTERS]);
            }

            function getUniqueSymbol() {
                if (availableLetters.length === 0) resetSymbols();
                return availableLetters.pop();
            }

            // ==========================================
            // 2. УМНЫЕ И ПЛАВНЫЕ РЫБКИ
            // ==========================================
            const canvas = document.getElementById('spring-canvas');
            const ctx = canvas.getContext('2d');
            let animationFrameId;
            let canvasActive = false;
            let fishArray = [];
            let ripples = [];
            let mouse = { x: -1000, y: -1000 };

            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }

            class Fish {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    
                    // Параметры плавного блуждания
                    this.wanderAngle = Math.random() * Math.PI * 2;
                    this.maxSpeed = Math.random() * 0.6 + 0.8; // Спокойная скорость
                    this.maxForce = 0.05; // Плавность поворотов
                    
                    this.vx = Math.cos(this.wanderAngle) * this.maxSpeed;
                    this.vy = Math.sin(this.wanderAngle) * this.maxSpeed;
                    
                    this.size = Math.random() * 5 + 11;
                    this.hue = 340 + Math.random() * 20;
                    this.angle = this.wanderAngle;
                    this.tailPhase = Math.random() * Math.PI * 2;
                    this.rippleTimer = 0;
                }

                update() {
                    // 1. Плавное блуждание (Wander behavior)
                    this.wanderAngle += (Math.random() - 0.5) * 0.15; // Плавное изменение курса
                    let steerX = Math.cos(this.wanderAngle) * this.maxSpeed;
                    let steerY = Math.sin(this.wanderAngle) * this.maxSpeed;

                    // 2. Отталкивание от стенок (плавное)
                    const margin = 80;
                    if (this.x < margin) steerX += (margin - this.x) * 0.03;
                    if (this.x > canvas.width - margin) steerX -= (this.x - (canvas.width - margin)) * 0.03;
                    if (this.y < margin) steerY += (margin - this.y) * 0.03;
                    if (this.y > canvas.height - margin) steerY -= (this.y - (canvas.height - margin)) * 0.03;

                    // 3. Реакция на курсор
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    let isFleeing = false;

                    if (dist < 120) {
                        isFleeing = true;
                        const force = (120 - dist) / 120;
                        steerX += (dx / dist) * force * 0.8;
                        steerY += (dy / dist) * force * 0.8;
                        
                        this.rippleTimer--;
                        if (this.rippleTimer <= 0) {
                            ripples.push(new Ripple(this.x - this.vx * 3, this.y - this.vy * 3));
                            this.rippleTimer = 5;
                        }
                    } else {
                        // Случайные волны при обычном плавании
                        this.rippleTimer--;
                        if (Math.random() < 0.01 && this.rippleTimer <= 0) {
                            ripples.push(new Ripple(this.x, this.y));
                            this.rippleTimer = 40;
                        }
                    }

                    // 4. Применение рулевой силы (плавное ускорение к цели)
                    let ax = steerX - this.vx;
                    let ay = steerY - this.vy;
                    let aMag = Math.sqrt(ax * ax + ay * ay);
                    if (aMag > this.maxForce) {
                        ax = (ax / aMag) * this.maxForce;
                        ay = (ay / aMag) * this.maxForce;
                    }
                    this.vx += ax;
                    this.vy += ay;

                    // 5. Ограничение скорости (при испуге рыба плывет быстрее)
                    let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    let currentMax = isFleeing ? 3.5 : this.maxSpeed;
                    if (speed > currentMax) {
                        this.vx = (this.vx / speed) * currentMax;
                        this.vy = (this.vy / speed) * currentMax;
                    }

                    this.x += this.vx;
                    this.y += this.vy;
                    this.angle = Math.atan2(this.vy, this.vx);

                    // Скорость виляния хвостом зависит от скорости плавания
                    this.tailPhase += 0.1 + speed * 0.3;
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);

                    const L = this.size;
                    const H = this.size * 0.32;
                    const tailWag = Math.sin(this.tailPhase) * 0.5;

                    // Хвост-вилка
                    ctx.save();
                    ctx.translate(-L * 0.65, 0);
                    ctx.rotate(tailWag);
                    ctx.fillStyle = `hsla(${this.hue}, 75%, 78%, 0.65)`;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-L * 0.55, -H * 2.2);
                    ctx.quadraticCurveTo(-L * 0.25, -H * 0.4, -L * 0.2, 0);
                    ctx.quadraticCurveTo(-L * 0.25, H * 0.4, -L * 0.55, H * 2.2);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.strokeStyle = `hsla(${this.hue}, 70%, 55%, 0.3)`;
                    ctx.lineWidth = 0.6;
                    ctx.beginPath();
                    ctx.moveTo(-L * 0.1, 0); ctx.lineTo(-L * 0.45, -H * 1.6);
                    ctx.moveTo(-L * 0.1, 0); ctx.lineTo(-L * 0.45, H * 1.6);
                    ctx.stroke();
                    ctx.restore();

                    // Спинной плавник
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 80%, 0.5)`;
                    ctx.beginPath();
                    ctx.moveTo(-L * 0.05, -H * 0.95);
                    ctx.quadraticCurveTo(-L * 0.15, -H * 2.0, -L * 0.4, -H * 0.65);
                    ctx.quadraticCurveTo(-L * 0.3, -H * 0.75, -L * 0.05, -H * 0.95);
                    ctx.closePath();
                    ctx.fill();

                    // Брюшной плавник
                    ctx.beginPath();
                    ctx.moveTo(-L * 0.15, H * 0.85);
                    ctx.quadraticCurveTo(-L * 0.25, H * 1.7, -L * 0.45, H * 0.5);
                    ctx.quadraticCurveTo(-L * 0.35, H * 0.6, -L * 0.15, H * 0.85);
                    ctx.closePath();
                    ctx.fill();

                    // Тело
                    const bodyGradient = ctx.createLinearGradient(0, -H, 0, H);
                    bodyGradient.addColorStop(0, `hsla(${this.hue}, 80%, 88%, 0.75)`);
                    bodyGradient.addColorStop(0.5, `hsla(${this.hue}, 85%, 75%, 0.7)`);
                    bodyGradient.addColorStop(1, `hsla(${this.hue}, 80%, 60%, 0.6)`);
                    ctx.fillStyle = bodyGradient;

                    ctx.beginPath();
                    ctx.moveTo(L * 0.78, 0);
                    ctx.bezierCurveTo(L * 0.55, -H * 1.0, -L * 0.1, -H * 1.05, -L * 0.65, -H * 0.18);
                    ctx.lineTo(-L * 0.65, H * 0.18);
                    ctx.bezierCurveTo(-L * 0.1, H * 1.05, L * 0.55, H * 1.0, L * 0.78, 0);
                    ctx.closePath();
                    ctx.fill();

                    // Грудной плавник
                    ctx.save();
                    ctx.translate(L * 0.15, H * 0.35);
                    ctx.rotate(0.4 + Math.sin(this.tailPhase * 0.7) * 0.15);
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 82%, 0.55)`;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, L * 0.22, H * 0.35, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Жабры
                    ctx.strokeStyle = `hsla(${this.hue}, 50%, 45%, 0.35)`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(L * 0.3, -H * 0.55);
                    ctx.quadraticCurveTo(L * 0.22, 0, L * 0.3, H * 0.55);
                    ctx.stroke();

                    // Рот
                    ctx.beginPath();
                    ctx.moveTo(L * 0.78, -H * 0.05);
                    ctx.lineTo(L * 0.68, H * 0.08);
                    ctx.stroke();

                    // Глаз
                    ctx.fillStyle = 'rgba(255, 240, 245, 0.95)';
                    ctx.beginPath(); ctx.arc(L * 0.5, -H * 0.28, H * 0.24, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(30, 10, 20, 0.95)';
                    ctx.beginPath(); ctx.arc(L * 0.53, -H * 0.28, H * 0.12, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.beginPath(); ctx.arc(L * 0.56, -H * 0.34, H * 0.05, 0, Math.PI * 2); ctx.fill();

                    ctx.restore();
                }
            }

            class Ripple {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 2;
                    this.opacity = 0.5;
                }
                update() {
                    this.radius += 0.6;
                    this.opacity -= 0.012;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 183, 197, ${this.opacity})`;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
            }

            function initSpringCanvas() {
                resizeCanvas();
                fishArray = [];
                ripples = [];
                for (let i = 0; i < 9; i++) {
                    fishArray.push(new Fish());
                }
                canvasActive = true;
                animateSpring();
                
                window.addEventListener('resize', resizeCanvas);
                canvas.parentElement.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    mouse.x = e.clientX - rect.left;
                    mouse.y = e.clientY - rect.top;
                });
                canvas.parentElement.addEventListener('mouseleave', () => {
                    mouse.x = -1000;
                    mouse.y = -1000;
                });
            }

            function animateSpring() {
                if (!canvasActive) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                ripples = ripples.filter(r => r.opacity > 0);
                ripples.forEach(r => { r.update(); r.draw(); });
                fishArray.forEach(f => { f.update(); f.draw(); });

                animationFrameId = requestAnimationFrame(animateSpring);
            }

            function stopSpringCanvas() {
                canvasActive = false;
                cancelAnimationFrame(animationFrameId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // ==========================================
            // 3. СЕЗОНЫ И ПЕРЕКЛЮЧАТЕЛЬ
            // ==========================================
            function getCurrentSeason() {
                const month = new Date().getMonth();
                if (month === 11 || month <= 1) return 'winter';
                if (month >= 2 && month <= 4) return 'spring';
                if (month >= 5 && month <= 7) return 'summer';
                return 'autumn';
            }

            function applyTheme(themeName) {
                const container = document.getElementById('particles-container');
                const body = document.body;

                container.innerHTML = '';
                stopSpringCanvas();
                canvas.style.display = 'none';
                
                body.className = ''; 
                if (body.classList.contains('modal-open')) body.classList.add('modal-open');

                let activeSeason = themeName === 'auto' ? getCurrentSeason() : themeName;
                body.classList.add('season-' + activeSeason);

                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === themeName);
                });

                if (activeSeason === 'spring') {
                    canvas.style.display = 'block';
                    initSpringCanvas();
                } else {
                    let particleCount = 25; 
                    for (let i = 0; i < particleCount; i++) {
                        const p = document.createElement('div');
                        p.className = 'particle p-' + activeSeason;
                        
                        if (activeSeason === 'summer') {
                            p.style.left = (Math.random() * 90) + '%';
                            p.style.top = (Math.random() * 90) + '%';
                        } else {
                            p.style.left = Math.random() * 100 + '%';
                            p.style.top = '-20px';
                        }
                        
                        let duration;
                        if (activeSeason === 'autumn') duration = (Math.random() * 5 + 6) + 's'; 
                        if (activeSeason === 'winter') duration = (Math.random() * 5 + 6) + 's'; 
                        if (activeSeason === 'summer') duration = (Math.random() * 5 + 5) + 's'; 
                        
                        p.style.animationDuration = duration;
                        p.style.animationDelay = (Math.random() * 5) + 's';
                        
                        if (activeSeason !== 'autumn') {
                            p.style.transform = `scale(${Math.random() * 0.5 + 0.8})`;
                        }
                        
                        container.appendChild(p);
                    }
                }
            }

            function initThemeSwitcher() {
                const savedTheme = localStorage.getItem('epallaxis_theme') || 'auto';
                applyTheme(savedTheme);

                document.getElementById('theme-switcher').addEventListener('click', (e) => {
                    if (e.target.classList.contains('theme-btn')) {
                        const theme = e.target.dataset.theme;
                        localStorage.setItem('epallaxis_theme', theme);
                        applyTheme(theme);
                    }
                });
            }

            // ==========================================
            // 4. КАРТОЧКИ
            // ==========================================
            const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTUP42gakKnz4G1oQfH3ddgNUshPTs8zyvRmc-Pxfio0INuAh3OAzDM2bgXoIcW5ezzSRdQsCz0zMzW/pub?gid=0&single=true&output=csv';
            const dialog = document.getElementById('section-dialog');
            const dialogTitle = document.getElementById('dialog-title');
            const dialogSections = document.getElementById('dialog-sections');
            const dialogClose = document.getElementById('dialog-close');

            function openModal() {
                document.body.classList.add('modal-open');
                dialog.showModal();
            }

            function closeModal() {
                document.body.classList.remove('modal-open');
                dialog.close();
            }

            dialogClose.addEventListener('click', closeModal);
            dialog.addEventListener('click', (e) => {
                const rect = dialog.getBoundingClientRect();
                if (e.clientY < rect.top || e.clientY > rect.top + rect.height ||
                    e.clientX < rect.left || e.clientX > rect.left + rect.width) {
                    closeModal();
                }
            });
            dialog.addEventListener('cancel', (e) => { e.preventDefault(); closeModal(); });

            function parseCSV(text) {
                const rows = []; let row = []; let cell = ''; let inQuotes = false;
                for (let i = 0; i < text.length; i++) {
                    const ch = text[i], next = text[i + 1];
                    if (ch === '"') { if (inQuotes && next === '"') { cell += '"'; i++; } else { inQuotes = !inQuotes; } }
                    else if (ch === ',' && !inQuotes) { row.push(cell.trim()); cell = ''; }
                    else if ((ch === '\n' || ch === '\r') && !inQuotes) {
                        if (ch === '\r' && next === '\n') i++;
                        row.push(cell.trim()); if (row.some(c => c !== '')) rows.push(row); row = []; cell = '';
                    } else { cell += ch; }
                }
                if (cell !== '' || row.length > 0) { row.push(cell.trim()); if (row.some(c => c !== '')) rows.push(row); }
                return rows;
            }

            function escapeHTML(value) {
                if (!value) return '';
                return String(value).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
            }

            function openSectionDialog(title, sections) {
                dialogTitle.textContent = title;
                dialogSections.innerHTML = '';
                
                sections.forEach(sec => {
                    const a = document.createElement('a');
                    a.className = 'section-btn';
                    a.href = sec.link;
                    a.innerHTML = `<span>${escapeHTML(sec.name)}</span><span class="arrow">→</span>`;
                    dialogSections.appendChild(a);
                });
                openModal();
            }

            function createCardElement(item) {
                const card = document.createElement(item.sections.length > 0 ? 'button' : 'div');
                card.className = 'card';
                
                if (item.sections.length > 0) card.classList.add('is-clickable');

                const uniqueLetter = getUniqueSymbol();

                let tagsHTML = '';
                if (item.sections.length > 0) {
                    tagsHTML = `<div class="card-tags">
                        ${item.sections.map(s => `<span class="card-tag">${escapeHTML(s.name)}</span>`).join('')}
                    </div>`;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-math-icon">${uniqueLetter}</span>
                    </div>
                    <h2 class="card-title">${escapeHTML(item.title)}</h2>
                    <p class="card-text">${escapeHTML(item.text)}</p>
                    ${tagsHTML}
                `;

                if (item.sections.length === 1) {
                    card.addEventListener('click', () => window.location.href = item.sections[0].link);
                } else if (item.sections.length > 1) {
                    card.addEventListener('click', () => openSectionDialog(item.title, item.sections));
                }

                return card;
            }

            async function loadCatalog() {
                const container = document.getElementById('cards-grid');
                
                if (window.location.protocol === 'file:') {
                    container.innerHTML = '<div class="status-message">ERROR: USE LIVE SERVER</div>';
                    return;
                }

                try {
                    const response = await fetch(CSV_URL);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const text = await response.text();
                    const rows = parseCSV(text);

                    const items = rows.slice(1).map(row => {
                        const active = (row[13] || '').toUpperCase();
                        if (active !== 'TRUE' && active !== '1' && active !== 'ИСТИНА' && active !== 'ДА') return null;

                        const sections = [];
                        for (let i = 3; i <= 11; i += 2) {
                            if (row[i+1] && row[i+1].trim()) {
                                sections.push({ name: row[i] || 'Раздел', link: row[i+1].trim() });
                            }
                        }

                        return { title: row[1] || '', text: row[2] || '', sections: sections };
                    }).filter(i => i !== null);

                    if (items.length === 0) {
                        container.innerHTML = '<div class="status-message">NO ACTIVE MODULES FOUND</div>';
                        return;
                    }

                    resetSymbols();

                    container.innerHTML = '';
                    items.forEach(item => container.appendChild(createCardElement(item)));

                } catch (error) {
                    console.error(error);
                    container.innerHTML = '<div class="status-message">DATA SYNC ERROR</div>';
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                initThemeSwitcher();
                loadCatalog();
            });
            
        })();
    </script>
</body>
</html>
