<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Еще — EPALLAXIS</title>

<link rel="icon" type="image/png" href="../../icon.png">


<style>

/* =========================
   VARIABLES
========================= */

:root {

  --bg:#060a10;
  --panel:#101820;
  --panel2:#141f2b;

  --text:#e8f0ea;
  --muted:#9aa4b2;

  --accent:#22ff88;

  --border:
    rgba(34,255,136,.18);

  --radius:18px;

}


/* =========================
   RESET
========================= */

* {

margin:0;
padding:0;
box-sizing:border-box;

font-family:
system-ui,
-apple-system,
"Segoe UI",
Roboto,
Arial,
sans-serif;

}


body {

min-height:100vh;

background:

radial-gradient(
900px 500px at 20% 0%,
#10251c,
#060a10 65%
);

color:var(--text);

padding:

0 20px 50px;

}


/* =========================
   HEADER
========================= */


header {

position:sticky;

top:0;

z-index:10;

margin:0 -20px;

padding:18px 20px;

background:

rgba(6,10,16,.85);

backdrop-filter:
blur(14px);

border-bottom:
1px solid var(--border);

}


.logo {

font-size:28px;

font-weight:800;

letter-spacing:2px;

}


.logo span {

color:var(--accent);

}


.subtitle {

margin-top:5px;

font-size:14px;

color:var(--muted);

}


/* =========================
   TITLE
========================= */


.page-title {

max-width:1400px;

margin:

35px auto 25px;

}


.page-title h1 {

font-size:

clamp(32px,5vw,46px);

}


.page-title span {

color:var(--accent);

}


.page-title p {

margin-top:8px;

color:var(--muted);

}


/* =========================
   UPDATE BUTTON
========================= */


.reload-btn {

margin-top:18px;

padding:

9px 22px;

border-radius:30px;

border:

1px solid var(--border);

background:

transparent;

color:var(--muted);

cursor:pointer;

transition:.3s;

}


.reload-btn:hover {

color:var(--accent);

border-color:var(--accent);

}


.reload-btn:disabled {

opacity:.5;

cursor:not-allowed;

}



/* =========================
   CARDS
========================= */


.cards {

width:100%;

max-width:1400px;

margin:auto;

display:flex;

flex-direction:column;

gap:16px;

}



/* =========================
   CARD
========================= */


.extra-card {

width:100%;

display:flex;

align-items:center;

gap:22px;

padding:

24px 30px;


background:

linear-gradient(
145deg,
var(--panel),
var(--panel2)
);


border-radius:

var(--radius);


border:

1px solid rgba(255,255,255,.08);


text-decoration:none;

color:var(--text);


position:relative;

overflow:hidden;


transition:.35s;


}


.extra-card::before {

content:"";

position:absolute;

left:0;

top:0;

height:100%;

width:5px;

background:

var(--card-color);

}


.extra-card:hover {

transform:

translateY(-4px);


border-color:

var(--card-color);


box-shadow:

0 15px 40px

rgba(0,0,0,.35);

}



/* ICON */


.card-icon {

width:65px;

height:65px;

flex-shrink:0;


display:flex;

align-items:center;

justify-content:center;


font-size:34px;


border-radius:16px;


background:

color-mix(
in srgb,
var(--card-color) 15%,
transparent
);


}



/* TEXT */


.card-info {

flex:1;

min-width:0;

}


.card-name {

font-size:23px;

font-weight:650;

}


.card-description {

margin-top:8px;

font-size:15px;

line-height:1.5;

color:var(--muted);

overflow-wrap:anywhere;

}


.card-arrow {

font-size:30px;

color:

var(--card-color);

opacity:.5;

}



.message {

text-align:center;

padding:40px;

color:var(--muted);

}


.message.error {

color:#ff7777;

}

/* =========================
   CARD ANIMATION
========================= */

.extra-card {
  opacity:0;
  transform:translateY(20px);
  animation:
    fadeUp .5s ease forwards;
}


@keyframes fadeUp {

  from {
    opacity:0;
    transform:translateY(20px);
  }

  to {
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================
   LOADING
========================= */

.loading {

  animation:
    pulse 1.3s infinite;

}


@keyframes pulse {

  0%,100% {
    opacity:.5;
  }

  50% {
    opacity:1;
  }

}


/* =========================
   FOOTER SPACE
========================= */

.bottom-space {

  height:40px;

}



/* =========================
   RESPONSIVE LARGE
========================= */


@media(max-width:1100px){

.cards {

  max-width:100%;

}


.extra-card {

  min-height:100px;

}


}



@media(max-width:500px){


.page-title h1 {

  font-size:30px;

}


.page-title p {

  font-size:14px;

}


.reload-btn {

  width:100%;

}


.extra-card {

  flex-direction:row;

  align-items:flex-start;

}


.card-icon {

  margin-top:2px;

}


}



</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->


<header>


<div class="header-row">


<div>


<div class="logo">

EPALLAXIS <span>extra</span>

</div>


<div class="subtitle">

Дополнительные материалы и возможности

</div>


</div>


</div>


</header>



<!-- =========================
     PAGE TITLE
========================= -->


<section class="page-title">


<h1>

Еще <span>материалы</span>

</h1>


<p>

Полезные разделы, инструменты и дополнительные возможности

</p>



<button 
class="reload-btn"
id="reloadBtn">

🔄 Обновить карточки

</button>



</section>




<!-- =========================
     CARDS
========================= -->


<main 
class="cards"
id="cardsContainer">


<div class="message loading">

⏳ Загрузка карточек...

</div>


</main>




<div class="bottom-space"></div>





<script>


/* =====================================================
   GOOGLE SHEETS
===================================================== */


const sheetURL = 
"https://docs.google.com/spreadsheets/d/e/2PACX-1vT-ffMQhoWFYjEYo_1zj42dMreh4l1HQKXEV9J_ZnI4NLkMvYVyL7KWmmdwRCX3qoHjSq8czHR-bvWX/pub?output=csv";




/* =====================================================
   RANDOM DESIGN
===================================================== */


const icons = [

"🚀",
"📚",
"🧠",
"🎯",
"🛠️",
"💡",
"📌",
"⭐",
"🔥",
"🎓",
"⚡",
"🌌"

];



const colors = [

"#22ff88",
"#4dd9ff",
"#a78bfa",
"#f59e0b",
"#34d399",
"#60a5fa",
"#fb7185",
"#f472b6"

];



function randomItem(array){

return array[
Math.floor(
Math.random()*array.length
)
];

}




/* =====================================================
   SAFE CSV PARSER
===================================================== */


function parseCSV(text){


const rows=[];

let row=[];

let value="";

let quotes=false;



for(let i=0;i<text.length;i++){


const char=text[i];


if(char === '"'){


if(quotes && text[i+1]==='"'){

value+='"';

i++;

}

else {

quotes=!quotes;

}


}

else if(char===',' && !quotes){


row.push(value);

value="";


}

else if(char==='\n' && !quotes){


row.push(value);

rows.push(row);

row=[];

value="";


}

else {


value+=char;


}



}


if(value || row.length){

row.push(value);

rows.push(row);

}



return rows;


}





/* =====================================================
   LOAD DATA
===================================================== */


let loading = false;



async function loadCards(){


if(loading){

return;

}


loading=true;


const button=
document.getElementById("reloadBtn");


button.classList.add("loading");

button.textContent=
"⏳ Обновление...";



const container=
document.getElementById("cardsContainer");



container.innerHTML=
`
<div class="message loading">
⏳ Загрузка карточек...
</div>
`;



try{


const response=
await fetch(
sheetURL+
"&t="+Date.now()
);



if(!response.ok){

throw new Error(
"Ошибка загрузки таблицы"
);

}



const csv=
await response.text();



const rows=
parseCSV(csv);



if(rows.length<2){

throw new Error(
"Таблица пустая"
);

}



const headers=
rows[0]
.map(
x=>x.trim().toLowerCase()
);



const orderIndex=
headers.indexOf(
"порядок"
);


const nameIndex=
headers.indexOf(
"название"
);


const descIndex=
headers.indexOf(
"описание"
);


const linkIndex=
headers.indexOf(
"ссылка"
);


const activeIndex=
headers.indexOf(
"активность"
);



if(
orderIndex===-1 ||
nameIndex===-1 ||
linkIndex===-1 ||
activeIndex===-1
){

throw new Error(
"Не найдены нужные столбцы"
);

}



const cards=[];



for(let i=1;i<rows.length;i++){


const row=rows[i];


if(!row.length)
continue;



let active=
row[activeIndex]
.trim()
.toLowerCase();



if(
active!=="true" &&
active!=="да" &&
active!=="1"
){

continue;

}



cards.push({

order:
Number(
row[orderIndex]
),

name:
row[nameIndex]
.trim(),

description:
descIndex!==-1
?
row[descIndex].trim()
:
"",

link:
row[linkIndex].trim()


});


}



cards.sort(
(a,b)=>
a.order-b.order
);



renderCards(cards);



}

catch(error){


console.error(error);



container.innerHTML=

`
<div class="message error">

⚠️ ${error.message}

</div>
`;


}


finally{


loading=false;


button.classList.remove("loading");


button.textContent=
"🔄 Обновить карточки";


}



}
/* =====================================================
   RENDER CARDS
===================================================== */


function renderCards(items){


const container=
document.getElementById(
"cardsContainer"
);



if(!items.length){


container.innerHTML=

`
<div class="message">

📭 Активных карточек пока нет

</div>
`;

return;

}



container.innerHTML="";



items.forEach(
(item,index)=>{


const card=
document.createElement("a");


card.className=
"extra-card";


card.href=
item.link;


card.target=
"_blank";



const color=
randomItem(colors);


const icon=
randomItem(icons);



card.style.setProperty(
"--card-color",
color
);



card.style.animationDelay=
(index*0.06)+"s";



card.innerHTML=

`

<div class="card-icon">

${icon}

</div>


<div class="card-info">


<div class="card-name">

${escapeHTML(item.name)}

</div>


<div class="card-description">

${escapeHTML(item.description)}

</div>


</div>


<div class="card-arrow">

→

</div>


`;



container.appendChild(card);



}

);



}





/* =====================================================
   TEXT SECURITY
===================================================== */


function escapeHTML(text){


return text

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");


}




/* =====================================================
   UPDATE BUTTON
===================================================== */


document
.getElementById("reloadBtn")
.addEventListener(
"click",
()=>{


loadCards();


}

);





/* =====================================================
   START
===================================================== */


loadCards();



</script>


</body>

</html>
