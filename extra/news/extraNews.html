<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Объявления — EPALLAXIS extra</title>
<link rel="icon" type="image/png" href="../../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0A0705;--bg-elevated:#0F0B08;--surface:linear-gradient(160deg,#1A1310 0%,#0F0B08 100%);--surface-solid:#14100C;--surface-hover:linear-gradient(160deg,#241A14 0%,#14100C 100%);
--text:#F5F0EB;--text-muted:#9C938C;--text-dim:#6B625C;
--accent:#FF8A00;--accent-glow:rgba(255,138,0,0.25);--accent-light:#FFB454;--accent-dim:rgba(255,138,0,0.08);
--border:rgba(255,255,255,0.06);--border-strong:rgba(255,255,255,0.1);--border-hover:rgba(255,138,0,0.4);
--danger:#FF5C4D;--danger-glow:rgba(255,92,77,0.3);--danger-dim:rgba(255,92,77,0.08);--danger-border:rgba(255,92,77,0.35);
--purple:#A855F7;--purple-glow:rgba(168,85,247,0.25);--purple-dim:rgba(168,85,247,0.08);--purple-border:rgba(168,85,247,0.35);
--font-sans:'Inter',sans-serif;--font-display:'Manrope',sans-serif;--font-mono:'JetBrains Mono',monospace;
--shadow-card:0 1px 0 rgba(255,255,255,0.04) inset,0 20px 40px -20px rgba(0,0,0,0.9),0 4px 12px -4px rgba(0,0,0,0.5)
}
body.season-winter{
--bg:#080C14;--bg-elevated:#0B1019;--surface:linear-gradient(160deg,#141D2E 0%,#0B1019 100%);--surface-solid:#0E1422;--surface-hover:linear-gradient(160deg,#1A2436 0%,#0E1422 100%);
--text:#EEF2F8;--text-muted:#8794A8;--text-dim:#5A6478;
--accent:#3B82F6;--accent-glow:rgba(59,130,246,0.25);--accent-light:#7EB3FF;--accent-dim:rgba(59,130,246,0.08);
--border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.12);--border-hover:rgba(59,130,246,0.4)
}
body.season-spring{
--bg:#0C0A0B;--bg-elevated:#120E10;--surface:linear-gradient(160deg,#231A1D 0%,#120E10 100%);--surface-solid:#180F13;--surface-hover:linear-gradient(160deg,#2E2024 0%,#180F13 100%);
--text:#F7EEF0;--text-muted:#B9A6AB;--text-dim:#7C696E;
--accent:#FFB7C5;--accent-glow:rgba(255,183,197,0.25);--accent-light:#FFD4DC;--accent-dim:rgba(255,183,197,0.08);
--border:rgba(255,255,255,0.06);--border-strong:rgba(255,255,255,0.1);--border-hover:rgba(255,183,197,0.4)
}
body.season-summer{
--bg:#060A08;--bg-elevated:#0A120E;--surface:linear-gradient(160deg,#122018 0%,#0A120E 100%);--surface-solid:#0C160F;--surface-hover:linear-gradient(160deg,#192E22 0%,#0C160F 100%);
--text:#EDF5F0;--text-muted:#8FA69A;--text-dim:#5E7268;
--accent:#10B981;--accent-glow:rgba(16,185,129,0.25);--accent-light:#4FD9A8;--accent-dim:rgba(16,185,129,0.08);
--border:rgba(255,255,255,0.06);--border-strong:rgba(255,255,255,0.1);--border-hover:rgba(16,185,129,0.4)
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background-color:var(--bg);scroll-behavior:smooth;transition:background-color .4s;width:100%;max-width:100%;overflow-x:clip}
body{color:var(--text);font-family:var(--font-sans);line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;display:flex;flex-direction:column;position:relative;font-feature-settings:"ss01","cv11"}
body::before,body::after{content:'';position:fixed;width:100vmax;height:100vmax;border-radius:50%;filter:blur(160px);z-index:-1;pointer-events:none;transition:background .4s}
body::before{top:-50vmax;left:-50vmax;background:var(--accent);opacity:.13}
body::after{bottom:-50vmax;right:-50vmax;background:var(--accent-light);opacity:.04}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.frame{max-width:1200px;margin:0 auto;padding:0 32px;width:100%;flex-grow:1;display:flex;flex-direction:column}

header{padding:28px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:24px}
.brand{font-family:var(--font-display);font-size:1.15rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:6px}
.brand em{font-style:normal;color:var(--accent);font-weight:500;letter-spacing:.04em;text-shadow:0 0 24px var(--accent-glow);transition:color .4s,text-shadow .4s}
.header-right{display:flex;align-items:center;gap:20px}
.theme-switcher{display:inline-flex;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:999px;padding:3px;gap:1px}
.theme-btn{background:transparent;border:none;color:var(--text-dim);font-family:var(--font-mono);font-size:.65rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;padding:7px 13px;border-radius:999px;cursor:pointer;transition:background-color .25s,color .25s,box-shadow .25s}
.theme-btn:hover{color:var(--text-muted)}
.theme-btn.active{background:var(--accent);color:#0A0705;font-weight:600;box-shadow:0 0 14px var(--accent-glow)}

.hero{position:relative;padding:96px 0 64px;border-bottom:1px solid var(--border);overflow:hidden;transition:border-color .4s}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .3s;opacity:0}
.season-particles{position:absolute;inset:0;pointer-events:none;z-index:0}
.hero-kicker{position:relative;z-index:1;font-family:var(--font-mono);font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.22em;color:var(--text-dim);margin-bottom:28px;display:flex;align-items:center;gap:14px}
.hero-kicker::before{content:'';width:32px;height:1px;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.hero-title{position:relative;z-index:1;font-family:var(--font-display);font-size:clamp(2.4rem,6.5vw,5rem);font-weight:800;line-height:.98;letter-spacing:-.04em;text-transform:uppercase;margin-bottom:20px}
.hero-title em{display:block;font-style:normal;font-size:.32em;font-weight:700;letter-spacing:-.01em;margin-top:18px;background:linear-gradient(90deg,var(--accent-light) 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px var(--accent-glow);transition:background .4s}
.hero-meta{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:44px;align-items:center}
.hero-pill{display:inline-flex;align-items:baseline;gap:8px;padding:8px 14px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:999px;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
.hero-pill b{font-family:var(--font-display);font-weight:800;font-size:.95rem;color:var(--text);letter-spacing:-.01em}
.hero-pill .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);align-self:center}
.hero-action{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:999px;font-family:var(--font-mono);font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);cursor:pointer;transition:all .25s;margin-left:auto}
.hero-action:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);box-shadow:0 0 16px var(--accent-glow)}
.hero-action:disabled{opacity:.5;cursor:not-allowed;border-color:var(--border);color:var(--text-dim);background:transparent;box-shadow:none}
.hero-action svg{width:14px;height:14px;flex-shrink:0}
.hero-action.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-bottom{position:relative;z-index:1;display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:64px;align-items:start;padding-top:32px;border-top:1px solid var(--border)}
.greek-quote{font-size:.98rem;font-style:italic;color:var(--accent);padding-left:18px;border-left:2px solid var(--accent);text-shadow:0 0 16px var(--accent-glow);line-height:1.6;transition:color .4s,border-color .4s,text-shadow .4s}
.hero-side{display:flex;flex-direction:column;gap:20px}
.hero-desc{font-size:.95rem;color:var(--text-muted);line-height:1.7;max-width:620px}
.hero-desc b{color:var(--text);font-weight:600}

.particle{position:absolute;z-index:0;pointer-events:none;opacity:0;animation-fill-mode:both}
.p-autumn{width:22px;height:22px;background-size:contain;background-repeat:no-repeat;background-position:center;top:-30px;animation:fall-and-spin linear infinite}
.p-autumn:nth-child(3n+1){background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,5 L65,35 L95,35 L75,60 L85,90 L50,75 L15,90 L25,60 L5,35 L35,35 Z" fill="%23DC2626" opacity="0.7"/></svg>')}
.p-autumn:nth-child(3n+2){width:26px;height:26px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,5 C60,20 75,20 75,35 C85,40 85,60 75,70 C85,85 60,95 50,95 C40,95 15,85 25,70 C15,60 15,40 25,35 C25,20 40,20 50,5 Z" fill="%23D97706" opacity="0.7"/></svg>')}
.p-autumn:nth-child(3n+3){width:18px;height:18px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,5 C85,25 95,60 50,95 C5,60 15,25 50,5 Z" fill="%23FBBF24" opacity="0.7"/></svg>')}
@keyframes fall-and-spin{0%{transform:translateY(-10px) translateX(0) rotate(0) rotateX(0);opacity:0}10%{opacity:.7}50%{transform:translateY(200px) translateX(40px) rotate(180deg) rotateX(60deg)}90%{opacity:.7}100%{transform:translateY(450px) translateX(-20px) rotate(360deg) rotateX(0);opacity:0}}
.p-winter{width:3px;height:3px;border-radius:50%;background:#FFF;box-shadow:0 0 6px #FFF;top:-20px;animation:fall linear infinite;opacity:.7}
.p-winter:nth-child(even){width:5px;height:5px;opacity:.4}
@keyframes fall{0%{transform:translateY(-10px) translateX(0);opacity:0}10%{opacity:.7}100%{transform:translateY(400px) translateX(30px);opacity:0}}
.p-summer{width:3px;height:3px;border-radius:50%;background:#FDE047;box-shadow:0 0 12px 2px #EAB308,0 0 20px 4px rgba(234,179,8,.35);animation:float-firefly linear infinite}
.p-summer:nth-child(even){width:2px;height:2px}
.p-summer:nth-child(3n){width:4px;height:4px;background:#FEF08A}
@keyframes float-firefly{0%{transform:translate(0,0) scale(.8);opacity:0}20%{opacity:.8}50%{transform:translate(30px,-40px) scale(1.2);opacity:.5}80%{opacity:.65}100%{transform:translate(-20px,-100px) scale(.8);opacity:0}}

main{padding:48px 0 32px}

.cards{display:flex;flex-direction:column;gap:16px}

.extra-card{
position:relative;display:flex;align-items:stretch;
background:var(--surface);border:1px solid var(--border);border-radius:16px;
overflow:hidden;text-decoration:none;color:var(--text);
transition:transform .35s cubic-bezier(.4,0,.2,1),border-color .35s,box-shadow .35s,background .35s;
box-shadow:var(--shadow-card);
--card-color:var(--purple);--card-glow:var(--purple-glow);--card-border:var(--purple-border);
opacity:0;transform:translateY(20px);animation:cardAppear .5s cubic-bezier(.16,1,.3,1) forwards
}
@keyframes cardAppear{to{opacity:1;transform:translateY(0)}}

.extra-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--card-color);opacity:.7;transition:opacity .3s}
.extra-card:hover::before{opacity:1;box-shadow:0 0 12px var(--card-glow)}

.extra-card.is-important{
--card-color:var(--danger);--card-glow:var(--danger-glow);--card-border:var(--danger-border)
}
.extra-card.is-important{border-color:var(--danger-border);background:linear-gradient(160deg,#1A0E0D 0%,#0F0807 100%)}

.extra-card:not(.no-links):hover{
border-color:var(--card-color);transform:translateY(-2px);
box-shadow:0 20px 40px -20px rgba(0,0,0,.9),0 0 24px var(--card-glow),0 1px 0 rgba(255,255,255,.04) inset
}

.extra-card.no-links{cursor:default}
.extra-card.no-links:hover{transform:none;border-color:var(--border)}
.extra-card.is-important.no-links:hover{border-color:var(--danger-border)}

.card-icon-wrap{display:flex;align-items:center;justify-content:center;padding:26px 22px;border-right:1px solid var(--border);background:rgba(0,0,0,.15);flex-shrink:0}
.card-icon-wrap svg{width:28px;height:28px;color:var(--card-color);opacity:.85;transition:color .3s,transform .3s,opacity .3s}
.extra-card:not(.no-links):hover .card-icon-wrap svg{transform:scale(1.08);opacity:1}

.card-info{flex:1;min-width:0;padding:20px 24px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.card-date{font-family:var(--font-mono);font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim)}
.card-badge-important{font-family:var(--font-mono);font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--danger);background:var(--danger-dim);border:1px solid var(--danger-border);padding:3px 9px;border-radius:4px}
.card-name{font-family:var(--font-display);font-size:clamp(1rem,1.8vw,1.2rem);font-weight:800;letter-spacing:-.015em;line-height:1.25;color:var(--text);transition:color .25s}
.extra-card:not(.no-links):hover .card-name{color:var(--card-color)}
.card-desc{font-size:.9rem;line-height:1.6;color:var(--text-muted);overflow-wrap:anywhere}

.card-action-wrap{display:flex;align-items:center;justify-content:center;padding:20px 26px;border-left:1px solid var(--border);background:rgba(0,0,0,.15);flex-shrink:0}
.card-action{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text-muted);transition:all .3s}
.card-action svg{width:16px;height:16px}
.extra-card:not(.no-links):hover .card-action{color:#0A0705;background:var(--card-color);border-color:var(--card-color);transform:scale(1.05);box-shadow:0 0 16px var(--card-glow)}

.card-sections{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:18px 22px;border-left:1px solid var(--border);background:rgba(0,0,0,.15);min-width:220px;flex-shrink:0}
.section-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;font-family:var(--font-display);font-size:.82rem;font-weight:600;color:var(--text);transition:all .25s;white-space:nowrap;text-decoration:none}
.section-btn span:last-child{font-family:var(--font-sans);color:var(--card-color);transition:color .2s}
.section-btn:hover{background:var(--card-color);color:#0A0705;border-color:var(--card-color);box-shadow:0 0 12px var(--card-glow)}
.section-btn:hover span:last-child{color:#0A0705}

.message{
text-align:center;padding:60px 24px;color:var(--text-muted);
font-family:var(--font-mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;
border:1px dashed var(--border);border-radius:16px;background:rgba(0,0,0,.2)
}
.message.error{color:var(--danger);border-color:var(--danger-border);background:var(--danger-dim)}
.message.loading{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

.top-btn{position:fixed;bottom:28px;right:28px;z-index:1000;width:44px;height:44px;padding:0;border:1px solid var(--border);border-radius:50%;background:rgba(15,11,8,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--text-muted);font-family:var(--font-mono);font-size:1.1rem;font-weight:500;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.top-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.6),0 0 24px var(--accent-glow)}

.back-btn{position:fixed;bottom:28px;left:28px;z-index:1000;padding:10px 18px;border:1px solid var(--border);border-radius:999px;background:rgba(15,11,8,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--text-muted);font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:500;transition:all .3s;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.back-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.6),0 0 24px var(--accent-glow)}

footer{padding:40px 0 32px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin-top:40px}
.footer-brand{font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.18em;color:var(--text-dim)}
.footer-brand b{color:var(--text-muted);font-weight:500}
.footer-meta{font-family:var(--font-mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.14em;color:var(--text-dim);display:flex;gap:20px;flex-wrap:wrap}
.footer-meta span{display:flex;align-items:center;gap:8px}
.footer-meta span::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.6}

@media(max-width:960px){
.hero{padding:72px 0 48px}
.hero-bottom{grid-template-columns:1fr;gap:32px}
.card-sections{min-width:180px}
}
@media(max-width:768px){
.frame{padding:0 20px}
header{flex-direction:column;align-items:flex-start;gap:16px;padding:20px 0}
.header-right{flex-direction:row;width:100%;justify-content:space-between}
.hero{padding:56px 0 40px}
.hero-title{font-size:clamp(2rem,7vw,3rem)}
.hero-meta{margin-bottom:32px;gap:8px}
.hero-pill{padding:6px 12px;font-size:.65rem}
.hero-pill b{font-size:.85rem}
.hero-action{width:100%;justify-content:center;margin-left:0;padding:10px 16px}
.hero-bottom{padding-top:24px;gap:24px}
main{padding:32px 0 24px}
.extra-card{flex-direction:column}
.card-icon-wrap{border-right:none;border-bottom:1px solid var(--border);padding:18px 20px;justify-content:flex-start}
.card-icon-wrap svg{width:24px;height:24px}
.card-info{padding:18px 20px}
.card-action-wrap{border-left:none;border-top:1px solid var(--border);padding:14px 20px;justify-content:flex-end}
.card-sections{border-left:none;border-top:1px solid var(--border);padding:14px 20px;min-width:0;flex-direction:row;flex-wrap:wrap}
.section-btn{flex:1;min-width:120px}
.top-btn{width:40px;height:40px;bottom:20px;right:20px;font-size:1rem}
.back-btn{bottom:20px;left:20px;font-size:.65rem;padding:8px 14px}
footer{flex-direction:column;align-items:flex-start;gap:12px;padding:32px 0}
}
@media(max-width:400px){
.frame{padding:0 14px}
.theme-btn{font-size:.55rem;padding:6px 9px;letter-spacing:.06em}
.hero-title{font-size:1.6rem}
.hero-title em{font-size:.35em;margin-top:14px}
.card-info{padding:14px 16px}
.card-name{font-size:1rem}
.card-desc{font-size:.85rem}
}
</style>
</head>
<body>
<div class="frame">

<header>
<a href="../../index.html" class="brand">EPALLAXIS<em>_extra</em></a>
<div class="header-right">
<div class="theme-switcher" id="theme-switcher">
<button class="theme-btn" data-theme="auto">AUTO</button>
<button class="theme-btn" data-theme="autumn">ОСЕНЬ</button>
<button class="theme-btn" data-theme="winter">ЗИМА</button>
<button class="theme-btn" data-theme="spring">ВЕСНА</button>
<button class="theme-btn" data-theme="summer">ЛЕТО</button>
</div>
</div>
</header>

<section class="hero">
<canvas id="spring-canvas" class="hero-canvas"></canvas>
<div class="season-particles" id="particles-container"></div>

<div class="hero-kicker">Extra · Объявления</div>
<h1 class="hero-title">Объявления<em>о важном</em></h1>

<div class="hero-meta">
<div class="hero-pill"><span class="dot"></span><b id="statTotal">—</b>активных</div>
<div class="hero-pill"><span class="dot"></span><b id="statImportant">—</b>важных</div>
<button class="hero-action" id="reloadBtn">

<span>Обновить</span>

<script>
(function(){
'use strict';

var canvas=document.getElementById('spring-canvas');
var ctx=canvas.getContext('2d');
var animationFrameId,canvasActive=false,fishArray=[],ripples=[];
var mouse={x:-1000,y:-1000};

function resizeCanvas(){var r=canvas.parentElement.getBoundingClientRect();canvas.width=r.width;canvas.height=r.height}

function Fish(){
var side=Math.floor(Math.random()*4);
if(side===0){this.x=-50;this.y=Math.random()*canvas.height}
else if(side===1){this.x=canvas.width+50;this.y=Math.random()*canvas.height}
else if(side===2){this.x=Math.random()*canvas.width;this.y=-50}
else{this.x=Math.random()*canvas.width;this.y=canvas.height+50}
this.angle=Math.atan2(canvas.height/2-this.y,canvas.width/2-this.x);
this.wanderAngle=this.angle;
this.maxSpeed=Math.random()*0.5+1.2;
this.vx=Math.cos(this.angle)*this.maxSpeed;
this.vy=Math.sin(this.angle)*this.maxSpeed;
this.size=Math.random()*5+11;
this.hue=340+Math.random()*20;
this.tailPhase=Math.random()*Math.PI*2;
this.rippleTimer=0;this.opacity=0;
}
Fish.prototype.update=function(){
if(this.opacity<1)this.opacity+=0.015;
this.wanderAngle+=(Math.random()-0.5)*0.2;
var steerX=Math.cos(this.wanderAngle)*this.maxSpeed;
var steerY=Math.sin(this.wanderAngle)*this.maxSpeed;
var margin=100,turnForce=0.15;
if(this.x<margin)steerX+=(margin-this.x)*turnForce;
if(this.x>canvas.width-margin)steerX-=(this.x-(canvas.width-margin))*turnForce;
if(this.y<margin)steerY+=(margin-this.y)*turnForce;
if(this.y>canvas.height-margin)steerY-=(this.y-(canvas.height-margin))*turnForce;
var dx=this.x-mouse.x,dy=this.y-mouse.y;
var dist=Math.sqrt(dx*dx+dy*dy);
var flee=0;
if(dist<150){flee=(150-dist)/150;steerX+=(dx/dist)*flee*4;steerY+=(dy/dist)*flee*4;
this.rippleTimer--;if(this.rippleTimer<=0){ripples.push(new Ripple(this.x-this.vx*3,this.y-this.vy*3));this.rippleTimer=5}}
else{this.rippleTimer--;if(Math.random()<0.01&&this.rippleTimer<=0){ripples.push(new Ripple(this.x,this.y));this.rippleTimer=40}}
var dX=this.vx+steerX,dY=this.vy+steerY,mag=Math.sqrt(dX*dX+dY*dY);
var target=this.maxSpeed*(1+flee*1.5);
if(mag>0){dX=dX/mag*target;dY=dY/mag*target}
var da=Math.atan2(dY,dX),diff=da-this.angle;
while(diff>Math.PI)diff-=Math.PI*2;
while(diff<-Math.PI)diff+=Math.PI*2;
this.angle+=diff*(0.05+flee*0.1);
var cs=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
cs+=(target-cs)*0.04;
if(cs<0.5)cs=0.5;
this.vx=Math.cos(this.angle)*cs;
this.vy=Math.sin(this.angle)*cs;
this.x+=this.vx;this.y+=this.vy;
this.tailPhase+=0.15+cs*0.3;
};
Fish.prototype.draw=function(){
ctx.save();ctx.globalAlpha=this.opacity*0.85;
ctx.translate(this.x,this.y);ctx.rotate(this.angle);
var L=this.size,H=this.size*0.32;
var wag=Math.sin(this.tailPhase)*0.6;
ctx.save();ctx.translate(-L*0.65,0);ctx.rotate(wag);
ctx.fillStyle='hsla('+this.hue+',65%,72%,0.55)';
ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-L*0.55,-H*2.2);
ctx.quadraticCurveTo(-L*0.25,-H*0.4,-L*0.2,0);
ctx.quadraticCurveTo(-L*0.25,H*0.4,-L*0.55,H*2.2);
ctx.closePath();ctx.fill();ctx.restore();
var g=ctx.createLinearGradient(0,-H,0,H);
g.addColorStop(0,'hsla('+this.hue+',70%,82%,0.65)');
g.addColorStop(0.5,'hsla('+this.hue+',75%,68%,0.6)');
g.addColorStop(1,'hsla('+this.hue+',70%,55%,0.5)');
ctx.fillStyle=g;
ctx.beginPath();ctx.moveTo(L*0.78,0);
ctx.bezierCurveTo(L*0.55,-H,-L*0.1,-H*1.05,-L*0.65,-H*0.18);
ctx.lineTo(-L*0.65,H*0.18);
ctx.bezierCurveTo(-L*0.1,H*1.05,L*0.55,H,L*0.78,0);
ctx.closePath();ctx.fill();
ctx.fillStyle='rgba(255,240,245,0.9)';
ctx.beginPath();ctx.arc(L*0.5,-H*0.28,H*0.22,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(30,10,20,0.9)';
ctx.beginPath();ctx.arc(L*0.53,-H*0.28,H*0.11,0,Math.PI*2);ctx.fill();
ctx.restore();
};
function Ripple(x,y){this.x=x;this.y=y;this.radius=2;this.opacity=0.4}
Ripple.prototype.update=function(){this.radius+=0.5;this.opacity-=0.01};
Ripple.prototype.draw=function(){ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.strokeStyle='rgba(255,183,197,'+this.opacity+')';ctx.lineWidth=1;ctx.stroke()};

function initSpringCanvas(){
resizeCanvas();fishArray=[];ripples=[];
for(var i=0;i<8;i++)fishArray.push(new Fish());
canvasActive=true;animateSpring();
window.addEventListener('resize',resizeCanvas);
canvas.parentElement.addEventListener('mousemove',function(e){var r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});
canvas.parentElement.addEventListener('mouseleave',function(){mouse.x=-1000;mouse.y=-1000});
canvas.parentElement.addEventListener('touchmove',function(e){var r=canvas.getBoundingClientRect();mouse.x=e.touches[0].clientX-r.left;mouse.y=e.touches[0].clientY-r.top},{passive:true});
canvas.parentElement.addEventListener('touchend',function(){mouse.x=-1000;mouse.y=-1000});
}
function animateSpring(){
if(!canvasActive)return;
ctx.clearRect(0,0,canvas.width,canvas.height);
ripples=ripples.filter(function(r){return r.opacity>0});
ripples.forEach(function(r){r.update();r.draw()});
fishArray.forEach(function(f){f.update();f.draw()});
animationFrameId=requestAnimationFrame(animateSpring);
}
function stopSpringCanvas(){
canvasActive=false;cancelAnimationFrame(animationFrameId);
ctx.clearRect(0,0,canvas.width,canvas.height);
}

function getCurrentSeason(){
var m=new Date().getMonth();
if(m===11||m<=1)return'winter';
if(m>=2&&m<=4)return'spring';
if(m>=5&&m<=7)return'summer';
return'autumn';
}

function applyTheme(name){
var c=document.getElementById('particles-container');
var b=document.body;
c.innerHTML='';stopSpringCanvas();canvas.style.opacity=0;
b.className='';
var active=name==='auto'?getCurrentSeason():name;
b.classList.add('season-'+active);
document.querySelectorAll('.theme-btn').forEach(function(btn){btn.classList.toggle('active',btn.dataset.theme===name)});
if(active==='spring'){canvas.style.display='block';canvas.style.opacity=1;initSpringCanvas()}
else{
canvas.style.display='none';
for(var i=0;i<22;i++){
var p=document.createElement('div');p.className='particle p-'+active;
if(active==='summer'){p.style.left=(Math.random()*90)+'%';p.style.top=(Math.random()*90)+'%'}
else{p.style.left=Math.random()*100+'%';p.style.top='-20px'}
var d;
if(active==='autumn')d=(Math.random()*5+6)+'s';
if(active==='winter')d=(Math.random()*5+6)+'s';
if(active==='summer')d=(Math.random()*5+5)+'s';
p.style.animationDuration=d;
p.style.animationDelay=(Math.random()*5)+'s';
if(active!=='autumn')p.style.transform='scale('+(Math.random()*0.5+0.8)+')';
c.appendChild(p);
}
}
}

function initThemeSwitcher(){
var saved=localStorage.getItem('epallaxis_theme')||'auto';
applyTheme(saved);
document.getElementById('theme-switcher').addEventListener('click',function(e){
if(e.target.classList.contains('theme-btn')){
var t=e.target.dataset.theme;
localStorage.setItem('epallaxis_theme',t);
applyTheme(t);
}
});
}

var sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTCrYk2HhIsUkgP3K1Be2fbVpZqefQ79KR-9hUUF_uZNNrAfhSHaZgwtb2z3DbZZ2ZtPjAEYojKoSnX/pub?gid=0&single=true&output=csv";

var icons=[
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
];

var arrowIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>';

function parseCSV(text){
var rows=[];var row=[];var value='';var quotes=false;
for(var i=0;i<text.length;i++){
var ch=text[i];
if(ch==='"'){if(quotes&&text[i+1]==='"'){value+='"';i++}else{quotes=!quotes}}
else if(ch===','&&!quotes){row.push(value);value=''}
else if(ch==='\n'&&!quotes){row.push(value);rows.push(row);row=[];value=''}
else{value+=ch}
}
if(value||row.length){row.push(value);rows.push(row)}
return rows;
}

function escapeHTML(text){
if(!text)return'';
return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

var loading=false;

async function loadCards(){
if(loading)return;
loading=true;
var button=document.getElementById('reloadBtn');
button.disabled=true;
button.classList.add('loading');
button.querySelector('span').textContent='Загрузка';

var container=document.getElementById('cardsContainer');
container.innerHTML='<div class="message loading">Загрузка объявлений…</div>';
document.getElementById('statTotal').textContent='—';
document.getElementById('statImportant').textContent='—';

try{
var response=await fetch(sheetURL+'&t='+Date.now());
if(!response.ok)throw new Error('Ошибка загрузки');
var csv=await response.text();
var rows=parseCSV(csv);
if(rows.length<2)throw new Error('Таблица пустая');

var headers=rows[0].map(function(x){return x.trim().toLowerCase().replace(/[^a-zа-яё0-9]/gi,'')});

var orderIndex=headers.indexOf('порядок');
var dateIndex=headers.indexOf('дата');
var importantIndex=headers.indexOf('важность');
var titleIndex=headers.indexOf('заголовок');
var textIndex=headers.indexOf('текст');
var activeIndex=headers.indexOf('активность');

if(orderIndex===-1||titleIndex===-1||activeIndex===-1)throw new Error('Не найдены обязательные столбцы');

var sectionPairs=[];
for(var k=1;k<=5;k++){
var nameIdx=headers.indexOf('секция'+k);
var linkIdx=headers.indexOf('ссылка'+k);
if(nameIdx!==-1&&linkIdx!==-1)sectionPairs.push({nameIdx:nameIdx,linkIdx:linkIdx});
}

var cards=[];
for(var j=1;j<rows.length;j++){
var row=rows[j];
if(!row.length)continue;
var active=row[activeIndex]?row[activeIndex].trim().toLowerCase():'';
if(active!=='true'&&active!=='да'&&active!=='1'&&active!=='истина')continue;

var isImportant=false;
if(importantIndex!==-1){
var val=row[importantIndex]?row[importantIndex].trim().toLowerCase():'';
isImportant=(val==='true'||val==='да'||val==='1'||val==='истина');
}

var dateStr='';
if(dateIndex!==-1&&row[dateIndex])dateStr=row[dateIndex].trim();

var sections=[];
sectionPairs.forEach(function(pair){
var name=row[pair.nameIdx]?row[pair.nameIdx].trim():'';
var link=row[pair.linkIdx]?row[pair.linkIdx].trim():'';
if(link)sections.push({name:name||'Перейти',link:link});
});

cards.push({
order:Number(row[orderIndex])||9999,
date:dateStr,
important:isImportant,
title:row[titleIndex]?row[titleIndex].trim():'',
text:textIndex!==-1&&row[textIndex]?row[textIndex].trim():'',
sections:sections
});
}

cards.sort(function(a,b){return a.order-b.order});

var importantCount=cards.filter(function(c){return c.important}).length;
document.getElementById('statTotal').textContent=cards.length;
document.getElementById('statImportant').textContent=importantCount;

renderCards(cards);
}catch(error){
console.error(error);
container.innerHTML='<div class="message error">'+escapeHTML(error.message)+'</div>';
}finally{
loading=false;
button.disabled=false;
button.classList.remove('loading');
button.querySelector('span').textContent='Обновить';
}
}

function renderCards(items){
var container=document.getElementById('cardsContainer');

if(!items.length){
container.innerHTML='<div class="message">Активных объявлений пока нет</div>';
return;
}

container.innerHTML='';

items.forEach(function(item,index){
var hasLinks=item.sections.length>0;
var isSingleLink=item.sections.length===1;
var card=document.createElement(isSingleLink?'a':'div');

card.className='extra-card';
card.classList.add(item.important?'is-important':'is-normal');
if(!hasLinks)card.classList.add('no-links');
if(isSingleLink){card.href=item.sections[0].link;card.target='_blank';card.rel='noopener noreferrer'}

card.style.animationDelay=(index*0.06)+'s';

var icon=icons[index%icons.length];

var metaHTML='';
if(item.date||item.important){
metaHTML='<div class="card-meta">';
if(item.date)metaHTML+='<span class="card-date">'+escapeHTML(item.date)+'</span>';
if(item.important)metaHTML+='<span class="card-badge-important">Важно</span>';
metaHTML+='</div>';
}

var rightSideHTML='';
if(hasLinks){
if(isSingleLink){
rightSideHTML='<div class="card-action-wrap"><div class="card-action">'+arrowIcon+'</div></div>';
}else{
rightSideHTML='<div class="card-sections">'+item.sections.map(function(sec){
return '<a href="'+escapeHTML(sec.link)+'" class="section-btn" target="_blank" rel="noopener noreferrer"><span>'+escapeHTML(sec.name)+'</span><span>→</span></a>';
}).join('')+'</div>';
}
}

card.innerHTML=
'<div class="card-icon-wrap">'+icon+'</div>'+
'<div class="card-info">'+metaHTML+
'<div class="card-name">'+escapeHTML(item.title)+'</div>'+
(item.text?'<div class="card-desc">'+escapeHTML(item.text)+'</div>':'')+
'</div>'+
rightSideHTML;

container.appendChild(card);
});
}

document.addEventListener('DOMContentLoaded',function(){
canvas.style.opacity=0;
initThemeSwitcher();
document.getElementById('reloadBtn').addEventListener('click',loadCards);
document.getElementById('topBtn').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
loadCards();
});
})();
</script>
